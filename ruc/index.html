<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studieplanlægger RUC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: fire trin, ét ad gangen. Lister er lukkede harmonikaer, så skærmen kun viser det, man er i gang med. Kursusnumre i mono som i kursusbasen. */
  --bg: #f2f3f7; --surface: #ffffff; --ink: #151926; --muted: #596073; --line: #dbdee8;
  --accent: #2f47d3; --accent-ink: #ffffff; --accent-soft: #e3e7fb;
  --ok: #15793f; --ok-bg: #dbf3e2; --info: #0b6f85; --info-bg: #d8eff5;
  --maybe: #6b3fc2; --maybe-bg: #ece5fa; --warn: #8a5a06; --warn-bg: #f9edcf; --none: #5b6273; --none-bg: #e5e7ee;
  --au: #9a4a12; --au-bg: #fbe7d6; --sp: #3f7414; --sp-bg: #e4f2d2; --bad: #b3261e; --bad-bg: #fbe1de;
  --s1: #7c8597; --s2: #2e9e6b; --s3: #d9772b; --s4: #c2478f; --s5: #8a63d2; --s6: #c9a227; --s7: #2f7fd3; --s8: #d1495b; --s9: #3aa6b9; --s10: #8d6e4a; --s11: #6b7f2a; --s12: #5b5bd6; --s13: #b39b12; --s14: #e07a9c;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1117; --surface: #181b24; --ink: #e8eaf2; --muted: #a0a7b8; --line: #2a2f3e;
    --accent: #8fa3ff; --accent-ink: #0c1130; --accent-soft: #222a4b;
    --ok: #6fd69b; --ok-bg: #133423; --info: #69d0e3; --info-bg: #0e3540;
    --maybe: #c3abf6; --maybe-bg: #2b2247; --warn: #edc468; --warn-bg: #3a2d0d; --none: #a3aabb; --none-bg: #242937;
    --au: #f0a875; --au-bg: #3d2413; --sp: #a6d977; --sp-bg: #1f3312; --bad: #ff9c92; --bad-bg: #47191a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1117; --surface: #181b24; --ink: #e8eaf2; --muted: #a0a7b8; --line: #2a2f3e;
  --accent: #8fa3ff; --accent-ink: #0c1130; --accent-soft: #222a4b;
  --ok: #6fd69b; --ok-bg: #133423; --info: #69d0e3; --info-bg: #0e3540;
  --maybe: #c3abf6; --maybe-bg: #2b2247; --warn: #edc468; --warn-bg: #3a2d0d; --none: #a3aabb; --none-bg: #242937;
    --au: #f0a875; --au-bg: #3d2413; --sp: #a6d977; --sp-bg: #1f3312; --bad: #ff9c92; --bad-bg: #47191a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.page { max-width: 820px; margin: 0 auto; padding: 20px 16px 56px; display: flex; flex-direction: column; gap: 18px; }

.top { display: flex; flex-direction: column; gap: 6px; }
.top h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.top p { color: var(--muted); max-width: 65ch; }
.unofficial { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; max-width: 80ch; }

.meters { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
body[data-view="kurser"] .meters { display: block; }
.mrow { display: flex; align-items: baseline; gap: 8px; }
.mrow .tv { font: 700 24px var(--display); font-variant-numeric: tabular-nums; }
.mrow .tl { font-size: 13px; color: var(--muted); }
.track { height: 6px; background: var(--none-bg); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 3px; }
.fill.full { background: var(--ok); }
.msub { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.msub .full { color: var(--ok); }

.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.step { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; padding: 9px 8px; background: none; border: 0; border-bottom: 3px solid var(--line); color: var(--muted); font: 500 14px var(--body); cursor: pointer; }
.step .sn { flex: none; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 600 12px var(--mono); background: var(--none-bg); color: var(--muted); }
.step .sl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step[aria-current] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.step[aria-current] .sn { background: var(--accent); color: var(--accent-ink); }
.step:disabled { opacity: 0.5; cursor: default; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.stepnav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 22px; }
.stepnav .btn { align-self: auto; }

.panels { display: grid; gap: 22px; }
.panel { display: none; min-width: 0; }
body[data-view="kurser"] #p-kurser, body[data-view="kandidater"] #p-kandidater, body[data-view="min-plan"] #p-min-plan, body[data-view="kandidatplan"] #p-kandidatplan { display: block; }
.panel > h2, #start h2 { font-size: 24px; margin-bottom: 6px; }
.lede { color: var(--muted); margin-bottom: 14px; max-width: 60ch; }

.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
.acch { width: 100%; display: flex; align-items: center; gap: 10px; padding: 13px 14px; background: none; border: 0; border-top: 1px solid var(--line); color: var(--ink); font: 500 15px var(--body); text-align: left; cursor: pointer; }
.acc > .acch:first-child { border-top: 0; }
.acch:hover { background: var(--accent-soft); }
.acch .t { flex: 1; min-width: 0; }
.acch .dot { margin-right: 8px; }
.acch .hint { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 6px; }
.acch .n { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
.acch .chev { flex: none; font-size: 18px; line-height: 1; color: var(--muted); transition: transform 0.15s; }
.acch[aria-expanded="true"] { font-weight: 600; }
.acch[aria-expanded="true"] .chev { transform: rotate(90deg); }
.acch.warnacc .n { background: var(--warn-bg); color: var(--warn); border-radius: 9px; padding: 1px 8px; }
.accb { padding: 2px 14px 12px; }
.accb .notes { padding-top: 4px; }
.linkbtn { background: none; border: 0; padding: 6px 0; color: var(--accent); font: 500 13px var(--body); text-decoration: underline; cursor: pointer; }
.req { display: block; color: var(--accent); }
.opens { font-size: 12px; color: var(--accent); padding: 0 6px 6px calc(18px + 3.4em + 26px); margin-top: -4px; }
@media (prefers-reduced-motion: reduce) { .acch .chev { transition: none; } }

.todo { background: var(--warn-bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 14px; }
.todo strong { color: var(--warn); }
.todo ul { margin: 4px 0 0; padding-left: 18px; }

.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.grp header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.grp h3 { font-size: 16px; }
.gsum { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
.grule { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }

.rows { display: flex; flex-direction: column; }
.crs { display: grid; grid-template-columns: 18px 3.4em minmax(0, 1fr) 2em; gap: 2px 10px; align-items: baseline; padding: 7px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 4px; }
.rows > .crs:first-child { border-top: 0; }
.crs:hover { background: var(--accent-soft); }
.crs input { margin: 0; width: 16px; height: 16px; accent-color: var(--accent); align-self: center; }
.crs .nr { font: 500 13px var(--mono); color: var(--muted); }
.crs .nm { overflow-wrap: anywhere; }
.crs.on .nm { font-weight: 500; }
.crs .sk { grid-column: 3 / 5; grid-row: 2; font-size: 12.5px; color: var(--muted); }
.crs .ec { grid-column: 4; grid-row: 1; font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.sea { display: inline-block; padding: 0 7px; border-radius: 9px; font: 600 11px var(--body); white-space: nowrap; vertical-align: 1px; }
.sea-E { background: var(--au-bg); color: var(--au); } .sea-F { background: var(--sp-bg); color: var(--sp); }
.semtag { margin-left: 8px; font: 500 11px var(--mono); color: var(--accent); white-space: nowrap; }
.clashline { font-size: 12px; font-weight: 500; color: var(--bad); padding: 0 6px 6px calc(18px + 3.4em + 26px); margin-top: -4px; }
.crs.bad .nr { color: var(--bad); }
.todo.bad { background: var(--bad-bg); } .todo.bad strong { color: var(--bad); }
.clash { background: var(--bad-bg); border-left: 3px solid var(--bad); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
.clash strong { color: var(--bad); }
.okline { font-size: 13px; font-weight: 500; color: var(--ok); }
.sems { display: flex; flex-direction: column; gap: 8px; }
.sem { min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.semh { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 0 2px; background: none; border: 0; color: var(--ink); font: 600 15px var(--display); text-align: left; cursor: pointer; }
.semh .t { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.semh .chev { flex: none; font-size: 18px; line-height: 1; color: var(--muted); transition: transform 0.15s; }
.semh[aria-expanded="true"] .chev { transform: rotate(90deg); }
.semsum { margin-top: -4px; }
.sem > .btn { align-self: flex-start; }
.sems + .btns, .btns + .btns, .btns + .small { margin-top: 10px; }
#p-kurser .btns + .small { margin-bottom: 14px; }
.rmb { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; font: 500 12px var(--body); color: var(--muted); cursor: pointer; }
.rmb:hover { color: var(--bad); border-color: var(--bad); }
.picker { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; }
.picker .find select { flex: 0 1 230px; max-width: 100%; padding: 8px; font: 400 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
.picks { display: flex; flex-direction: column; }
.pick { display: grid; grid-template-columns: 30px 3.4em minmax(0, 1fr) 2em; gap: 2px 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.picks > .pick:first-child { border-top: 0; }
/* Tilføj kursus: to grupper, så man kan se, hvad der hører til uddannelsen, og hvad der er frit valg. */
.pg { margin-top: 12px; border-radius: 8px; }
.pg-deg { background: var(--accent-soft); padding: 8px 10px 2px; border-left: 4px solid var(--accent); }
.pg-free { padding: 8px 10px 2px; border-left: 4px solid var(--line); }
.pgh { margin: 0; font: 600 14px var(--body); display: flex; align-items: center; gap: 7px; }
.pgdot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
.pg-free .pgdot { background: transparent; border: 2px solid var(--muted); }
.pgn { font: 500 12px var(--mono); color: var(--muted); }
.pgsub { margin: 2px 0 6px; font-size: 12.5px; color: var(--muted); }
.sembtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.sembtns .btn { margin: 0; }
.semsum .snr { font: 500 12px var(--mono); color: var(--ink); }
.si.si-ext { grid-template-columns: minmax(3.4em, max-content) minmax(0, 1fr) 2em; }
.si-ext .nr { font-size: 12px; white-space: nowrap; }
.si-ext .nr.arrow { font-size: 15px; color: var(--accent); }
.extform input.xnr { flex: 0 1 7.5em; font-family: var(--mono); }
.tag.tag-ext { background: var(--accent-soft); color: var(--accent); }
.extform { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; }
.extform .find { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.extform input[type="text"] { flex: 1 1 220px; min-width: 0; padding: 8px 10px; font: 400 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
/* Kandidatplan */
.mrow2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; padding: 6px 0 4px; font-weight: 600; }
.mrow2.sub { font-weight: 400; font-size: 13px; color: var(--muted); padding: 2px 0 2px 14px; }
.mrow2 .mv { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.mrow2 .mv.ok { color: var(--accent); }
.mrow2 .mbar { grid-column: 1 / 3; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.mrow2.sub .mbar { height: 3px; }
.mrow2 .mbar i { display: block; height: 100%; background: var(--accent); }
.semh.static { cursor: default; }
.semh.static:hover { background: none; }
.semtr { border-style: dashed; }
.tag.tag-ms { background: var(--accent-soft); color: var(--accent); }
.tag.tag-obl { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
/* Tilføj kursus: overskrift, små gruppeetiketter og lukkede kategorier, der åbnes én ad gangen. */
.pkh { margin: 0 0 8px; font: 600 14px var(--display); }
.pklab { margin: 14px 0 6px; font: 600 11px var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pcat.pcat-deg { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); font-weight: 600; }
.pcat.pcat-deg .dot { background: var(--accent); border-radius: 50%; }
.pcat .tag { margin-left: 8px; }
.pcatb .pgsub { margin: 8px 0 2px; }
.pcatb .pick:first-of-type { border-top: 0; }
.pall { display: block; margin: 6px 0 8px; }
@media (min-width: 640px) {
  .picker .pick { grid-template-columns: 30px 3.4em minmax(0, 1.5fr) minmax(0, 1fr) 2em; align-items: center; padding: 6px 0; }
  .picker .pick .sk { grid-column: 4; grid-row: 1; }
  .picker .pick .ec { grid-column: 5; grid-row: 1; }
}
.pgbtn { width: 100%; display: flex; align-items: center; gap: 7px; padding: 2px 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.pgbtn .chev, .pcat .chev { margin-left: auto; flex: none; font-size: 18px; line-height: 1; color: var(--muted); transition: transform 0.15s; }
.pgbtn[aria-expanded="true"] .chev, .pcat[aria-expanded="true"] .chev { transform: rotate(90deg); }
.pcats { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.pcat { width: 100%; display: flex; align-items: center; gap: 9px; padding: 10px 12px; background: none; border: 0; border-top: 1px solid var(--line); color: var(--ink); font: 500 14px var(--body); text-align: left; cursor: pointer; }
.pcats > .pcat:first-child { border-top: 0; }
.pcat:hover { background: var(--accent-soft); }
.pcat[aria-expanded="true"] { background: var(--bg); }
.pcat .t { flex: 1; min-width: 0; }
.pcat .chev { margin-left: 0; }
.pcatb { padding: 0 12px 4px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .pgbtn .chev, .pcat .chev { transition: none; } }
.pick .nr { font: 500 13px var(--mono); color: var(--muted); }
.pick .nm { overflow-wrap: break-word; hyphens: auto; }
.pick .ec { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.pick .sk { grid-column: 3 / 5; font-size: 12.5px; color: var(--muted); }
.addb { grid-row: 1 / 3; align-self: center; width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font: 600 18px/1 var(--body); cursor: pointer; }
.addb:hover { background: var(--accent); color: var(--accent-ink); }
.pclash { display: block; color: var(--bad); font-weight: 500; }
.sem.hasclash { border-color: var(--bad); }
.sem header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sem h4 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
.gsum.over { color: var(--warn); }
.sis { display: flex; flex-direction: column; }
.si { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) 2em; gap: 3px 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
.sis > .si:first-child { border-top: 0; }
.si .nr { font: 500 13px var(--mono); color: var(--muted); }
.si .nm { overflow-wrap: break-word; hyphens: auto; font-weight: 500; }
.si .ec { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.si .sk { grid-column: 2 / 4; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; font-size: 12.5px; color: var(--muted); }
.si.bad .tm { color: var(--bad); font-weight: 600; }
.si .contd { font-size: 12px; }
.si .ctl { display: inline-flex; align-items: center; gap: 6px; }
.si .mvs { max-width: 5.6em; color: var(--muted); padding: 2px 4px; cursor: pointer; }
.si select { max-width: 100%; font: 500 12px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.tabbadge { display: inline-block; min-width: 18px; text-align: center; font: 600 11px var(--mono); background: var(--bad); color: var(--surface); border-radius: 9px; padding: 0 5px; margin-left: 4px; }
.tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 500; background: var(--none-bg); color: var(--none); vertical-align: 1px; }
.tag-maybe { background: var(--maybe-bg); color: var(--maybe); }
.num { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.num input { width: 5.5em; padding: 5px 6px; font: 500 14px var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }

.tally { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip-sikker { background: var(--ok-bg); color: var(--ok); }
.chip-opfyldt { background: var(--info-bg); color: var(--info); }
.chip-maybe { background: var(--maybe-bg); color: var(--maybe); }
.chip-mangler { background: var(--warn-bg); color: var(--warn); }
.chip-info { background: var(--none-bg); color: var(--none); }
h3.uni { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; font-family: var(--body); font-weight: 600; }

.ms { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--none); border-radius: 8px; margin-bottom: 8px; }
.ms-sikker { border-left-color: var(--ok); } .ms-opfyldt { border-left-color: var(--info); } .ms-maybe { border-left-color: var(--maybe); } .ms-mangler { border-left-color: var(--warn); }
.mshead { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 0; }
.mstoggle { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 10px 4px 10px 12px; color: inherit; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
.msname { font-weight: 600; overflow-wrap: anywhere; }
.mssub { font-size: 13px; color: var(--muted); }
.wish { background: none; border: 1px solid var(--line); border-radius: 6px; width: 32px; height: 32px; font-size: 16px; line-height: 1; color: var(--muted); cursor: pointer; flex: none; }
.wish[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.msbody { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.msbody .en { font-size: 13px; color: var(--muted); font-style: italic; }
.msbody h4 { font-size: 14px; margin-top: 4px; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rule { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.rhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.rmark { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; }
.rule-ok .rmark { background: var(--ok-bg); color: var(--ok); } .rule-maybe .rmark { background: var(--maybe-bg); color: var(--maybe); } .rule-no .rmark { background: var(--warn-bg); color: var(--warn); }
.rlabel { font-weight: 500; flex: 1; min-width: 12ch; }
.rprog { font: 500 12px var(--mono); color: var(--muted); }
.cov, .rnote { font-size: 13px; color: var(--muted); margin-top: 4px; }
.flag { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 14px; cursor: pointer; }
.flag input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.notes { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.src { font-size: 12px; color: var(--muted); }
.btn { align-self: flex-start; background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 7px; padding: 8px 12px; font: 600 14px var(--body); cursor: pointer; }
.btn-ghost { background: none; color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 17px; }
.card h4 { font-size: 14px; }
.card p { max-width: 70ch; }
.wl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.wl li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.unitag { font: 500 11px var(--mono); color: var(--muted); }
.budget { font-size: 14px; }
.small { font-size: 13px; color: var(--muted); }
.grids { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.gridwrap { overflow-x: auto; }
.grid { width: 100%; min-width: 300px; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
.grid caption { text-align: left; font: 600 14px var(--display); padding-bottom: 4px; }
.grid th { font-weight: 500; color: var(--muted); padding: 3px; text-align: center; }
.grid tbody th { width: 3.4em; text-align: right; padding-right: 6px; font-family: var(--mono); }
.grid td { border: 1px solid var(--line); vertical-align: top; padding: 4px; height: 58px; }
.grid td.bad { background: var(--bad-bg); outline: 2px solid var(--bad); outline-offset: -2px; }
.sem .grid { min-width: 250px; } .sem .grid td { height: 34px; }
.mod { display: block; font: 400 10px var(--mono); color: var(--muted); }
.cn { display: inline-block; font: 500 11px var(--mono); padding: 0 4px; margin: 1px 2px 0 0; border-radius: 4px; background: var(--accent-soft); color: var(--ink); border: 1px solid transparent; }
.cn.alt { background: none; border: 1px dashed var(--muted); color: var(--muted); }
textarea { width: 100%; font: 400 12px var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }

.toprow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: none; color: var(--muted); font: 500 13px var(--body); padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.bachbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 6px; }
.bachbar .bl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.btn-sm { padding: 4px 10px; font-size: 13px; }
#start { display: none; }
body[data-view="start"] #start { display: block; }
body[data-view="start"] .panels { display: none; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.bpick { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--ink); font: 500 15px var(--body); cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.bpick:hover, .bpick.cur { border-color: var(--accent); background: var(--accent-soft); }
.bpick:disabled { opacity: 0.55; cursor: default; background: var(--surface); border-color: var(--line); }
.upick .bn { font: 700 22px var(--display); }
.upick .us { font-size: 13px; font-weight: 400; color: var(--muted); }
.unibar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-bottom: 12px; }
.unote { margin-bottom: 8px; max-width: 70ch; }
.tag-full { margin-left: 0; background: var(--ok-bg); color: var(--ok); }
.sech { font-size: 18px; margin: 18px 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; padding: 4px 11px; font: 500 13px var(--body); cursor: pointer; }
.fchip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fchip .cnt { font: 500 11px var(--mono); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 0 5px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--sc, var(--none)); flex: none; }
.grp.subj { border-left: 4px solid var(--sc, var(--line)); }
.grp.subj h3 { display: flex; align-items: center; gap: 8px; }
.s-basis { --sc: var(--s1); } .s-miljo { --sc: var(--s2); } .s-kemi { --sc: var(--s3); } .s-bio { --sc: var(--s4); } .s-proces { --sc: var(--s5); }
.s-mek { --sc: var(--s10); } .s-byg { --sc: var(--s11); } .s-el { --sc: var(--s12); } .s-energi { --sc: var(--s13); } .s-sund { --sc: var(--s14); }
.find { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.find input { flex: 1 1 220px; min-width: 0; padding: 8px 10px; font: 400 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
.find .btn { align-self: center; }
.hits { margin-bottom: 8px; }
.s-food { --sc: var(--s6); } .s-data { --sc: var(--s7); } .s-biz { --sc: var(--s8); } .s-fys { --sc: var(--s9); }
.chip-betinget { background: var(--info-bg); color: var(--info); }
.ms-betinget { border-left-color: var(--info); }
.infotoggle { margin-top: 14px; }
.foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 520px) {
  .mshead { flex-wrap: wrap; }
  .mstoggle { flex: 1 1 calc(100% - 52px); }
  .mshead .chip { order: 3; margin: -4px 0 10px 12px; }
  .step { flex-direction: column; gap: 4px; font-size: 12px; padding: 6px 2px 8px; }
  .panel > h2, #start h2 { font-size: 21px; }
}

/* Tilgængelighed: større trykflader, tydeligere felter, læsbar mindste-tekst */
:root { --field-line: #80879a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --field-line: #6b7388; } }
:root[data-theme="dark"] { --field-line: #6b7388; }
input, select, .rmb, .wish { border-color: var(--field-line); }
.crs .nm { overflow-wrap: break-word; hyphens: auto; }
.sea, .semtag, .pklab, .tag, .rmark, .cn { font-size: 12px; }
.tag.tag-obl { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.semh { min-height: 44px; }
.rmb, .si .mvs { min-height: 32px; }
.addb { width: 36px; height: 36px; }
.lang button, .btn-sm { min-height: 36px; }
.semsum[data-semopen] { cursor: pointer; }
@media (max-width: 520px) { .rmb, .si .mvs { min-height: 40px; } }


/* ==========================================================================
   Design C — "Blød og venlig": rolig planlægger-app.
   Sandfarvet baggrund, store afrundede kort med bløde skygger i stedet for
   streger, semestre som farvede fliser (efterår = fersken, forår = mynte),
   pilleformet fremskridtsmåler. Fraunces (blød) til overskrifter, Nunito til tekst.
   ========================================================================== */

:root {
  --bg: #f5efe6; --surface: #fffdf9; --ink: #2b2620; --muted: #655c52; --line: #ebe2d5;
  --accent: #1d6475; --accent-ink: #ffffff; --accent-soft: #dcecef;
  --ok: #2c6c33; --ok-bg: #e0efdb; --info: #2a5a9f; --info-bg: #e2eaf7;
  --maybe: #6a42b5; --maybe-bg: #ede6f8; --warn: #835309; --warn-bg: #f8e9cc; --none: #5e574f; --none-bg: #ece5da;
  --au: #964314; --au-bg: #fbe2cd; --sp: #3a6b15; --sp-bg: #e0efd0; --bad: #ae271e; --bad-bg: #fadfdb;
  --display: "Fraunces", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Nunito", "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --field-line: #8c8174;
  /* nye */
  --tile-au: #fcebdc; --tile-sp: #e7f2e1; --tile-x: #efe9f7;
  --raise: 0 1px 2px rgba(74, 52, 26, 0.05), 0 8px 24px -10px rgba(74, 52, 26, 0.18);
  --raise-hi: 0 2px 4px rgba(74, 52, 26, 0.06), 0 14px 30px -12px rgba(74, 52, 26, 0.26);
  --card-edge: transparent;
  --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1814; --surface: #25221d; --ink: #f2ece2; --muted: #bdb2a3; --line: #3a352d;
    --accent: #84cfdd; --accent-ink: #0b272e; --accent-soft: #1d3a40;
    --ok: #8fd69a; --ok-bg: #1b3420; --info: #9fbff4; --info-bg: #1d2b45;
    --maybe: #c9b2f6; --maybe-bg: #2e2548; --warn: #eec46e; --warn-bg: #3b2d10; --none: #b4ab9e; --none-bg: #322e27;
    --au: #f4ad7c; --au-bg: #42271a; --sp: #b0dc84; --sp-bg: #24351a; --bad: #ff9f95; --bad-bg: #4a1c1a;
    --field-line: #857b6e;
    --tile-au: #33271d; --tile-sp: #232e1f; --tile-x: #2a2540;
    --raise: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 26px -12px rgba(0, 0, 0, 0.6);
    --raise-hi: 0 2px 4px rgba(0, 0, 0, 0.35), 0 16px 32px -12px rgba(0, 0, 0, 0.7);
    --card-edge: #34302a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1814; --surface: #25221d; --ink: #f2ece2; --muted: #bdb2a3; --line: #3a352d;
  --accent: #84cfdd; --accent-ink: #0b272e; --accent-soft: #1d3a40;
  --ok: #8fd69a; --ok-bg: #1b3420; --info: #9fbff4; --info-bg: #1d2b45;
  --maybe: #c9b2f6; --maybe-bg: #2e2548; --warn: #eec46e; --warn-bg: #3b2d10; --none: #b4ab9e; --none-bg: #322e27;
  --au: #f4ad7c; --au-bg: #42271a; --sp: #b0dc84; --sp-bg: #24351a; --bad: #ff9f95; --bad-bg: #4a1c1a;
  --field-line: #857b6e;
  --tile-au: #33271d; --tile-sp: #232e1f; --tile-x: #2a2540;
  --raise: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 26px -12px rgba(0, 0, 0, 0.6);
  --raise-hi: 0 2px 4px rgba(0, 0, 0, 0.35), 0 16px 32px -12px rgba(0, 0, 0, 0.7);
  --card-edge: #34302a;
}

/* ---------- Grundlag ---------- */
body { font: 400 15.5px/1.55 var(--body); background: var(--bg); }
h1, h2, h3, h4 { font-weight: 650; letter-spacing: -0.005em; font-variation-settings: "SOFT" 100; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
.page { gap: 22px; padding: 26px 18px 64px; }
b, strong { font-weight: 700; }

/* ---------- Top ---------- */
.top h1 { font-size: 27px; font-weight: 650; display: flex; align-items: center; gap: 11px; }
.top h1::before {
  content: ""; flex: none; width: 30px; height: 30px; border-radius: 10px;
  background:
    radial-gradient(circle at 30% 30%, #f6b48f 0 34%, transparent 35%),
    radial-gradient(circle at 72% 68%, #8fc9a5 0 38%, transparent 39%),
    #cfe3ea;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
}
.top p { font-size: 16px; }
.lang { border: 0; border-radius: 999px; padding: 4px; gap: 2px; background: var(--surface); box-shadow: var(--raise), inset 0 0 0 1px var(--card-edge); }
.lang button { border-radius: 999px; padding: 6px 16px; font: 700 13.5px var(--body); color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* ---------- Trin (pille-navigation) ---------- */
.tabs { gap: 4px; padding: 5px; background: var(--surface); border-radius: 999px; box-shadow: var(--raise), inset 0 0 0 1px var(--card-edge); }
.step { border: 0; border-radius: 999px; padding: 8px 10px; min-height: 42px; font: 700 14px var(--body); color: var(--muted); transition: background-color 0.15s; }
.step:not(:disabled):not([aria-current]):hover { background: var(--bg); color: var(--ink); }
.step .sn { width: 24px; height: 24px; font: 800 12px var(--body); background: var(--none-bg); color: var(--muted); }
.step[aria-current] { background: var(--accent-soft); color: var(--ink); font-weight: 800; }
.step[aria-current] .sn { background: var(--accent); color: var(--accent-ink); }
.step:disabled { opacity: 0.55; }
.eyebrow { font: 800 11.5px var(--body); letter-spacing: 0.1em; color: var(--accent); margin-bottom: 6px; }
.panel > h2, #start h2 { font-size: 30px; margin-bottom: 8px; }
.lede { font-size: 16px; margin-bottom: 18px; }

/* ---------- Kort: skygger i stedet for streger ---------- */
.acc, .grp, .card, .picker, .extform, .ms, .meters {
  background: var(--surface); border: 1px solid var(--card-edge); border-radius: var(--r-lg); box-shadow: var(--raise);
}
.acc { margin-bottom: 16px; }
.acch { padding: 16px 20px; min-height: 52px; font: 700 15.5px var(--body); border-top-color: var(--line); }
.acch:hover, .pcat:hover, .crs:hover { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); }
.acch[aria-expanded="true"] { font-weight: 800; }
.acch .n { font: 500 12.5px var(--mono); }
.acch.warnacc .n { border-radius: 999px; padding: 2px 10px; font-weight: 500; }
.acch .chev, .semh .chev, .pgbtn .chev, .pcat .chev {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
  border-radius: 50%; background: var(--bg); color: var(--muted); font-size: 17px;
}
.accb { padding: 4px 20px 16px; }
.grp { padding: 16px 20px; margin-bottom: 14px; }
.grp.subj { border-left: 0; box-shadow: var(--raise), inset 5px 0 0 var(--sc, var(--line)); }
.grp h3 { font-size: 18px; }
.card { padding: 18px 22px; gap: 12px; margin-bottom: 16px; }
.card h3 { font-size: 20px; }
.todo { border-radius: var(--r-md); padding: 12px 16px; }
.clash { border-left: 0; border-radius: var(--r-sm); padding: 10px 14px; box-shadow: inset 4px 0 0 var(--bad); }

/* ---------- Måler: pilleformet ---------- */
.meters { padding: 18px 22px 16px; }
.mrow .tv { font: 650 34px var(--display); font-variation-settings: "SOFT" 100; letter-spacing: -0.01em; }
.mrow .tl { font-size: 14px; font-weight: 600; }
.track { height: 14px; border-radius: 999px; margin-top: 10px; background: var(--none-bg); padding: 3px; }
.fill { border-radius: 999px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, var(--surface)), var(--accent)); min-width: 8px; }
.fill.full { background: var(--ok); }
.msub { gap: 6px; margin-top: 12px; font-size: 13px; }
.msub span { background: var(--bg); color: var(--muted); border-radius: 999px; padding: 3px 11px; font-weight: 600; }
.msub .full { background: var(--ok-bg); color: var(--ok); }
.msub .full::before { content: "✓ "; }

/* Kandidatplan-målere */
.mrow2 .mbar { height: 10px; border-radius: 999px; background: var(--none-bg); }
.mrow2.sub .mbar { height: 6px; }
.mrow2 .mbar i { border-radius: 999px; }

/* ---------- Trin 1: valg-fliser ---------- */
.bgrid { gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.bpick {
  position: relative; border: 1px solid var(--card-edge); border-radius: var(--r-md); padding: 15px 16px 15px 44px;
  font: 700 15.5px var(--body); box-shadow: var(--raise); min-height: 56px; justify-content: center;
  transition: transform 0.15s, box-shadow 0.15s, background-color 0.15s;
}
.bpick::before {
  content: ""; position: absolute; left: 16px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
  border-radius: 50%; background: var(--dotc, var(--s2)); opacity: 0.9;
}
.bgrid > .bpick:nth-child(7n+1) { --dotc: #e79a6b; }
.bgrid > .bpick:nth-child(7n+2) { --dotc: #7fbf8f; }
.bgrid > .bpick:nth-child(7n+3) { --dotc: #9a8ee0; }
.bgrid > .bpick:nth-child(7n+4) { --dotc: #e8bf5a; }
.bgrid > .bpick:nth-child(7n+5) { --dotc: #6fb3cf; }
.bgrid > .bpick:nth-child(7n+6) { --dotc: #e28aa8; }
.bgrid > .bpick:nth-child(7n+7) { --dotc: #a7c46a; }
.bpick:hover { border-color: var(--card-edge); background: var(--surface); transform: translateY(-2px); box-shadow: var(--raise-hi); }
.bpick.cur { background: var(--accent-soft); border-color: var(--accent); box-shadow: var(--raise), inset 0 0 0 1px var(--accent); }
.bpick:disabled { background: var(--surface); border-color: var(--card-edge); transform: none; box-shadow: none; }
.upick { padding-left: 16px; }
.upick::before { display: none; }
.upick .bn { font: 650 24px var(--display); }
h3.uni { margin: 22px 0 10px; font: 800 11.5px var(--body); letter-spacing: 0.1em; }
@media (prefers-reduced-motion: reduce) { .bpick, .step { transition: none; } .bpick:hover { transform: none; } }

/* ---------- Semestre som farvede fliser ---------- */
.sems { gap: 14px; }
.sem {
  background: var(--tile-x); border: 1px solid var(--card-edge); border-radius: var(--r-lg);
  padding: 6px 18px 16px; gap: 10px; box-shadow: var(--raise);
}
.sem:has(.semh .sea-E) { background: var(--tile-au); }
.sem:has(.semh .sea-F) { background: var(--tile-sp); }
.sem.hasclash { border-color: var(--bad); box-shadow: var(--raise), inset 0 0 0 1px var(--bad); }
.semtr { border-style: dashed; border-color: var(--field-line); box-shadow: none; background: transparent; }
.semh { font: 650 19px var(--display); font-variation-settings: "SOFT" 100; padding: 10px 0 4px; min-height: 48px; }
.semh .gsum { font: 500 12.5px var(--mono); color: var(--ink); background: var(--surface); padding: 3px 10px; border-radius: 999px; }
.semh .gsum.over { color: var(--warn); }
.semh.static .gsum { background: var(--surface); }
.semsum { margin-top: -2px; font-size: 13.5px; line-height: 1.7; color: var(--muted); }
.semsum .snr { font: 500 12px var(--mono); color: var(--ink); background: color-mix(in srgb, var(--surface) 75%, transparent); padding: 1px 6px; border-radius: 6px; }
.sem .sis { background: var(--surface); border-radius: var(--r-md); padding: 4px 14px; }
.sem > .small:not(.semsum) { color: var(--muted); }

/* ---------- Kursusrækker ---------- */
.crs { border-radius: var(--r-sm); padding: 9px 8px; border-top-color: var(--line); }
.crs input, .flag input { width: 18px; height: 18px; }
.crs .nr, .pick .nr, .si .nr { font: 500 13px var(--mono); }
.si { border-top-color: var(--line); padding: 9px 0; }
.pick { border-top-color: var(--line); }
.sea { border-radius: 999px; padding: 1px 10px; font: 800 11.5px var(--body); letter-spacing: 0.01em; }
.tag, .chip, .rmark { border-radius: 999px; padding: 1px 10px; font-weight: 700; }
.chip { padding: 3px 11px; font-size: 12.5px; }
.tabbadge { border-radius: 999px; font: 800 11px var(--body); padding: 1px 7px; color: var(--surface); }
.rmb { border-radius: 999px; padding: 3px 12px; font: 700 12.5px var(--body); background: var(--surface); }

/* ==========================================================================

:root {

  }
}

  --bg: #111112; --surface: #1d1d1f; --ink: #f2f2f2; --muted: #b0b0b5; --line: #323236;

    function fits(n, it) { return (load[n] || 0) + it.ects <= 30 && (!isProj(it) || !proj[n]); }
    function put(it, n) { place[it.uid] = n; load[n] = (load[n] || 0) + it.ects; if (isProj(it)) proj[n] = 1; }
    // 1) brugerens egne valg, 2) basis med fast semester, 3) projekter, 4) resten efter anbefaling
    its.forEach(function (it) { var n = st.sem[it.uid]; if (n && n <= nSems()) put(it, n); });
    var order = its.filter(function (it) { return !place[it.uid]; }).sort(function (a, b) {
      function rank(x) { return x.grp === "basis" && x.rec ? 0 : x.grp === "basis" ? 0.5 : x.type === "ba" ? 0.8 : isProj(x) ? 1 : x.rec ? 2 : 3; }
      return rank(a) - rank(b) || (a.rec || 9) - (b.rec || 9);
    });
    var en = intl(prog());
    function clashCost(it, n) {
      if (isProj(it) || it.optIdx === -1) return 0;
      var mine = pickId(it.ids, season(n), en); if (!mine) return 0;
      var others = its.filter(function (o) { return place[o.uid] === n && !isProj(o) && o.optIdx !== -1; }).map(function (o) { var id = pickId(o.ids, season(n), en), a = id && act(id); return { key: o.uid, sched: a ? inSeason(a.sched, season(n)) : {} }; });
      if (!others.length) return 0;
      var a0 = act(mine); others.push({ key: it.uid, sched: inSeason(a0.sched, season(n)) });
      return RE.planSemester(others).clashes.filter(function (c) { return c.a === it.uid || c.b === it.uid; }).reduce(function (s, c) { return s + c.n; }, 0);
    }
    function dist(n, p0) { return n >= p0 ? n - p0 : (p0 - n) * 1.5; }
    order.forEach(function (it) {
      var vs = validSems(it); if (!vs.length) vs = [it.rec || 1];
      var p0 = it.type === "ba" ? nSems() : (it.rec || (it.grp === "valg" ? 5 : it.grp === "basis" ? 2 : 4));
      var minSem = it.grp === "f1" || it.grp === "f2" || it.grp === "ba" ? 3 : 1, best = null;
      vs.forEach(function (n) {
        var sc = dist(n, p0) + ((load[n] || 0) + it.ects > 30 ? 1000 : 0) + (isProj(it) && proj[n] ? 2000 : 0) + (n < minSem ? 1500 : 0) + clashCost(it, n) * 40;

    // Forbedring: lokal søgning, der flytter og bytter dele, så længe det samlede "pris" falder

      var inS = its.filter(function (it) { return place[it.uid] === n; }), ld = 0, pj = 0;

      var c = Math.max(0, ld - 30) * 200 + Math.max(0, pj - 1) * 3000;
      var cs = inS.filter(function (it) { return !isProj(it) && it.optIdx !== -1; });
      if (cs.length > 1) {
        var key = n + "|" + cs.map(function (it) { return it.uid; }).sort().join(",");
        if (clashCache[key] === undefined) {
          clashCache[key] = RE.planSemester(cs.map(function (o) { var id = pickId(o.ids, season(n), en), ac = id && act(id); return { key: o.uid, sched: ac ? inSeason(ac.sched, season(n)) : {}, fixed: st.hold[o.uid] || null }; })).clashes.reduce(function (s2, c2) { return s2 + c2.n; }, 0);
        }

      }
      return c;
    }
    function itemCost(it, n) {
      var p0 = it.type === "ba" ? nSems() : (it.rec || (it.grp === "valg" ? 5 : it.grp === "basis" ? 2 : 4));
      var minSem = it.grp === "f1" || it.grp === "f2" || it.grp === "ba" ? 3 : 1;
      return dist(n, p0) * 3 + (n < minSem ? 1500 : 0);

    var movable = its.filter(function (it) { return !st.sem[it.uid] && !(it.grp === "basis" && it.rec); });
    var vcache = {}; movable.forEach(function (it) { vcache[it.uid] = validSems(it); });
    for (var iter = 0; iter < 60; iter++) {
      var best = null;

      S.ects = S.items.reduce(function (a, it) { return a + it.ects; }, 0) + st.ext.filter(function (x) { return x.sem === S.n && !x.rep; }).reduce(function (a, x) { return a + x.ects; }, 0) + st.ext.filter(function (x) { return x.sem === S.n && x.rep; }).reduce(function (a, x) { return a + x.ects; }, 0);
      S.items.forEach(function (it) { it.sem = S.n; it.act = it.optIdx === -1 ? null : pickId(it.ids, S.season, intl(prog())); });
      var cs = S.items.filter(function (it) { return !isProj(it) && it.act; }).map(function (it) { var a = act(it.act); return { key: it.uid, sched: a ? inSeason(a.sched, S.season) : {}, fixed: st.hold[it.uid] || null }; });

    var h = '<section class="sem' + (S.plan.clashes.length ? " hasclash" : "") + '"><button type="button" class="semh" id="se-' + S.n + '" data-acc="s' + S.n + '" aria-expanded="' + open + '"><span class="t">' + T("semN", { n: S.n }) + ' <span class="sea sea-' + S.season + '">' + T(S.season === "E" ? "autumn" : "spring") + "</span>" + (S.n > 6 ? ' <span class="tag">' + T("tagExtra") + "</span>" : "") + (S.plan.clashes.length ? ' <span class="tabbadge">' + S.plan.clashes.length + "</span>" : "") + "</span>" +
      '<span class="gsum' + (S.ects > 30 ? " over" : "") + '">' + fmt(S.ects) + " ECTS" + (S.ects > 30 ? " · " + T("over30") : "") + '</span><span class="chev" aria-hidden="true">›</span></button>';
    if (!open) return h + '<p class="small semsum" data-acc="s' + S.n + '">' + (S.items.length || xs.length ? S.items.map(function (it) { return '<span class="sn">' + esc(it.optName || it.name) + "</span>"; }).concat(xs.map(function (x) { return '<span class="sn">' + esc(x.name || x.uni) + "</span>"; })).join(" · ") : T("empty")) + "</p></section>";
    S.plan.clashes.forEach(function (c) { h += '<p class="clash"><strong>' + T("clashH") + "</strong> " + esc(T("clashTxt", { a: nameOf(S, c.a), b: nameOf(S, c.b), n: c.n, w: RE.weeksText(c.weeks) })) + " " + T("clashFix") + "</p>"; });
    if (!S.items.length && !xs.length) h += '<p class="small">' + T("empty") + "</p>";
    h += '<div class="sis">' + S.items.map(function (it) { return itemHtml(it, S); }).join("") + xs.map(function (x) { return '<div class="si si-ext"><span class="nm">' + esc(x.name || T("tExt")) + ' <span class="tag tag-ext">' + T("tExt") + "</span>" + (x.uni ? ' <span class="small">' + esc(x.uni) + "</span>" : "") + '</span><span class="ec">' + fmt(x.ects) + "</span></div>"; }).join("") + "</div>";
    if (ui.grid[S.n]) h += weekGrid(S);
    var adding = ui.add === S.n;
    h += '<div class="sembtns"><button type="button" class="btn btn-ghost btn-sm" data-grid="' + S.n + '" aria-expanded="' + !!ui.grid[S.n] + '">' + T(ui.grid[S.n] ? "hideGrid" : "showGrid") + "</button>" +
      '<button type="button" class="btn btn-sm' + (adding ? " btn-ghost" : "") + '" data-add="' + S.n + '" aria-expanded="' + adding + '">' + (adding ? T("closeAdd") : "+ " + T("addEl")) + "</button></div>";
    if (adding) h += picker(S);
    return h + "</section>";
  }
  function nameOf(S, uid) { var it = S.items.filter(function (x) { return x.uid === uid; })[0]; return it ? (it.optName || it.name) : uid; }
  function more(id, name) { return id ? ' <a class="more" href="https://study.ruc.dk/class/view/' + esc(id) + '" target="_blank" rel="noopener" aria-label="' + esc(T("moreA", { c: name })) + '">' + T("more") + '<span aria-hidden="true">&nbsp;↗</span></a>' : ""; }
  function itemHtml(it, S) {
    var bad = S.plan.clashes.some(function (c) { return c.a === it.uid || c.b === it.uid; }), vs = validSems(it), nm = it.optName || it.name;
    var off = seasons(it.ids).length && seasons(it.ids).indexOf(S.season) < 0;
    var sel = '<label class="vh" for="mv-' + cssId(it.uid) + '">' + T("move") + '</label><select id="mv-' + cssId(it.uid) + '" data-mv="' + esc(it.uid) + '">' + vs.map(function (n) { return '<option value="' + n + '"' + (n === S.n ? " selected" : "") + ">" + T("semN", { n: n }) + "</option>"; }).join("") + "</select>";
    var opt = it.opts && it.opts.length > 1 ? '<label class="vh" for="op-' + cssId(it.uid) + '">' + T("choose") + '</label><select id="op-' + cssId(it.uid) + '" data-opt="' + esc(it.uid) + '">' + (it.optIdx < 0 ? '<option value="-1">' + T("choose") + "…</option>" : "") + it.opts.map(function (o, i) { return '<option value="' + i + '"' + (i === it.optIdx ? " selected" : "") + ">" + esc(o.name) + "</option>"; }).join("") + "</select>" : "";
    var holds = "", a = it.act ? act(it.act) : null;
    if (a && !isProj(it)) {
      var hs = RE.holdsOf(inSeason(a.sched, S.season));
      if (hs.length > 1) holds = '<label class="vh" for="ho-' + cssId(it.uid) + '">' + T("hold") + '</label><select id="ho-' + cssId(it.uid) + '" data-hold="' + esc(it.uid) + '"><option value="">' + T("holdAuto") + (S.plan.hold[it.uid] && !st.hold[it.uid] ? ": " + esc(S.plan.hold[it.uid]) : "") + "</option>" + hs.map(function (x) { return '<option value="' + esc(x.name) + '"' + (st.hold[it.uid] === x.name ? " selected" : "") + ">" + esc(x.name) + "</option>"; }).join("") + "</select>";
    }
    var when = a && !isProj(it) ? whenText(S.plan.slots(it.uid)) : (isProj(it) ? T("tProj") : "");
    var rm = it.grp === "valg" || /^k:/.test(it.uid) ? '<button type="button" class="rmb" data-rm="' + esc(it.uid) + '">' + T("remove") + "</button>" : "";
    return '<div class="si' + (bad || off ? " bad" : "") + '"><span class="nm">' + esc(nm) + ' <span class="tag' + (it.grp === "f1" || it.grp === "f2" || it.grp === "basis" || it.grp === "ba" ? " tag-obl" : "") + '">' + T(tagFor(it)) + "</span>" + (off ? ' <span class="tag tag-maybe">' + T("notOff") + "</span>" : "") + more(it.act, nm) + '</span><span class="ec">' + fmt(it.ects) + "</span>" +
      '<span class="sk"><span class="tm">' + esc(when) + '</span><span class="ctl">' + opt + holds + sel + rm + "</span></span></div>";
  }
  function cssId(u) { return u.replace(/[^a-zA-Z0-9_-]/g, "_"); }
  function whenText(slots) {
    var w = RE.weekly(slots || []); if (!w.length) return "";
    var di = pref.lang === "en" ? 1 : 0;
    var main = w.slice().sort(function (a, b) { return b.weeks.length - a.weeks.length; }).slice(0, 2);
    return main.map(function (s) { return DAYS[s.d - 1][di] + " " + s.f.slice(0, 2) + "." + s.f.slice(2) + "-" + s.t.slice(0, 2) + "." + s.t.slice(2); }).join(", ") + (w.length > 2 ? " …" : "");
  }
  // Ugeskema: typisk uge for semestrets kurser med det valgte hold.
  function weekGrid(S) {
    var di = pref.lang === "en" ? 1 : 0, rows = [];
    S.items.filter(function (it) { return !isProj(it) && it.act; }).forEach(function (it, idx) {
      RE.weekly(S.plan.slots(it.uid)).forEach(function (s) { rows.push({ it: it, s: s, c: idx % 14 + 1 }); });
    });
    if (!rows.length) return '<p class="small">' + T("projNote") + "</p>";
    var start = 8 * 60, end = 18 * 60, px = 0.7;
    rows.forEach(function (r) { start = Math.min(start, RE.mins(r.s.f)); end = Math.max(end, RE.mins(r.s.t)); });
    var h = '<div class="wk" role="table" aria-label="' + T("showGrid") + '"><div class="wkh" role="row"><span></span>' + DAYS.map(function (d) { return '<span role="columnheader">' + d[di] + "</span>"; }).join("") + '</div><div class="wkb" style="height:' + Math.round((end - start) * px) + 'px">';
    h += '<div class="wkt">';
    for (var m = Math.ceil(start / 60) * 60; m < end; m += 60) h += '<span style="top:' + Math.round((m - start) * px) + 'px">' + (m / 60) + "</span>";
    h += "</div>";
    for (var d = 1; d <= 5; d++) {
      h += '<div class="wkd" role="cell">';
      var day = rows.filter(function (r) { return r.s.d === d; }).sort(function (a, b) { return RE.mins(a.s.f) - RE.mins(b.s.f); }), lanes = [];
      day.forEach(function (r) { var i = 0; while (lanes[i] !== undefined && lanes[i] > RE.mins(r.s.f)) i++; lanes[i] = RE.mins(r.s.t); r.lane = i; });
      day.forEach(function (r) { r.nl = 1 + Math.max.apply(null, day.filter(function (o) { return RE.mins(o.s.f) < RE.mins(r.s.t) && RE.mins(r.s.f) < RE.mins(o.s.t); }).map(function (o) { return o.lane; })); });
      day.forEach(function (r) {
        var clash = S.plan.clashes.some(function (c) { return c.a === r.it.uid || c.b === r.it.uid; });
        h += '<div class="wkx s' + r.c + (clash ? " bad" : "") + '" style="left:calc(' + (100 * r.lane / r.nl) + '% + 2px);width:calc(' + (100 / r.nl) + '% - 4px);top:' + Math.round((RE.mins(r.s.f) - start) * px) + "px;height:" + Math.max(18, Math.round((RE.mins(r.s.t) - RE.mins(r.s.f)) * px)) + 'px" title="' + esc((r.it.optName || r.it.name) + " · " + T("weeks", { w: RE.weeksText(r.s.weeks) })) + '"><strong>' + esc(short(r.it.optName || r.it.name)) + "</strong><span>" + r.s.f.slice(0, 2) + "." + r.s.f.slice(2) + " · " + T("weeks", { w: RE.weeksText(r.s.weeks) }) + "</span></div>";
      });
      h += "</div>";
    }
    h += "</div></div>";
    // På smalle skærme: samme uge som liste pr. ugedag
    h += '<div class="wkl">' + DAYS.map(function (dd, i) {
      var day = rows.filter(function (r) { return r.s.d === i + 1; }).sort(function (a, b) { return RE.mins(a.s.f) - RE.mins(b.s.f); });
      if (!day.length) return "";
      return "<p><strong>" + dd[di] + "</strong></p><ul>" + day.map(function (r) { var clash = S.plan.clashes.some(function (c) { return c.a === r.it.uid || c.b === r.it.uid; }); return '<li class="wkli s' + r.c + (clash ? " bad" : "") + '"><span class="tmx">' + r.s.f.slice(0, 2) + "." + r.s.f.slice(2) + "-" + r.s.t.slice(0, 2) + "." + r.s.t.slice(2) + "</span> " + esc(short(r.it.optName || r.it.name)) + ' <span class="small">' + T("weeks", { w: RE.weeksText(r.s.weeks) }) + "</span></li>"; }).join("") + "</ul>";
    }).join("") + "</div>";
    return h;
  }
  function short(s) { s = s.replace(/^(Fagmodulkursus|Subject module course|Basiskursus|Basic course|Valgkursus|Elective course)\s*[\w\/.-]*\s*[:\-–]?\s*/i, ""); return s.length > 34 ? s.slice(0, 32) + "…" : s; }

  // Valgkurser: uddannelsens egne først, derefter andre kurser på RUC i semestrets sæson.
  function picker(S) {
    var p = prog(), q = ui.q.trim().toLowerCase(), en = intl(p), sea = S.season;
    var have = {}; items().forEach(function (it) { for (var t in it.ids) it.ids[t].forEach(function (i) { have[i] = 1; }); });
    function ok(id) { var a = act(id); return a && !have[id] && (sea === "E" ? a.term === "E2026" : a.term === CUR_F || a.term === "F2026") && a.ects > 0 && (!q || a.name.toLowerCase().indexOf(q) >= 0); }
    var own = [], seen = {};
    p.electives.forEach(function (o) { var id = pickId(o.ids, sea, en); if (id && ok(id) && !seen[norm(o.name)]) { seen[norm(o.name)] = 1; own.push(id); } });
    var other = [];
    if (q.length >= 2) Object.keys(RUC.acts).forEach(function (id) { var a = act(id); if (ok(id) && own.indexOf(id) < 0 && !/projekt|project|beskrivelse|description|studiestart|study start/i.test(a.name) && !seen[norm(a.name)]) { seen[norm(a.name)] = 1; other.push(id); } });
    function row(id) { var a = act(id); return '<div class="pick"><span class="nm">' + esc(a.name) + (a.lang.indexOf("en") >= 0 ? ' <span class="tag">EN</span>' : "") + more(id, a.name) + '</span><span class="ec">' + fmt(a.ects) + '</span><button type="button" class="addb" data-addel="' + id + '" data-sem="' + S.n + '" aria-label="' + T("addEl") + ": " + esc(a.name) + '">+</button></div>'; }
    return '<div class="picker"><div class="find"><label class="vh" for="q">' + T("qPh") + '</label><input type="search" id="q" autocomplete="off" placeholder="' + T("qPh") + '" value="' + esc(ui.q) + '"></div><div id="plist">' +
      '<p class="pklab">' + T("elProg") + "</p>" + (own.length ? own.map(row).join("") : '<p class="small">' + T("noHits") + "</p>") +
      (q.length >= 2 ? '<p class="pklab">' + T("elOther") + "</p>" + (other.length ? other.slice(0, 25).map(row).join("") : '<p class="small">' + T("noHits") + "</p>") : "") + "</div></div>";
  }

  // ---------- merit ----------
  function renderMerit(P) {
    var h = stepHead(3, T("hMerit"), T("lMerit")), its = items();
    // kurser fra andre universiteter
    h += "<h3>" + T("extH") + "</h3>";
    h += st.ext.length ? '<ul class="prevl">' + st.ext.map(function (x, i) {
      var rep = x.rep ? its.filter(function (it) { return it.uid === x.rep; })[0] : null;
      return '<li><span class="pn">' + (x.nr ? '<span class="nr">' + esc(x.nr) + "</span> " : "") + esc(x.name || "–") + (x.uni ? " · " + esc(x.uni) : "") + '</span><span class="tag tag-ok">' + (rep ? esc(T("extReplace", { n: rep.optName || rep.name })) : T("extAsValg")) + '</span><span class="ec">' + fmt(x.ects) + " ECTS · " + T("semN", { n: x.sem }) + '</span><button type="button" class="rmb" data-xrm="' + i + '">' + T("remove") + "</button></li>";
    }).join("") + "</ul>" : '<p class="small">' + T("extNone") + "</p>";
    var semOpts = ""; for (var n = 1; n <= nSems(); n++) semOpts += '<option value="' + n + '">' + T("semN", { n: n }) + "</option>";
    h += '<div class="xform"><label>' + T("extName") + ' <input id="xname" maxlength="80"></label><label>' + T("extNr") + ' <input id="xnr" maxlength="15"></label><label>' + T("extUni") + ' <input id="xuni" maxlength="60"></label><label>' + T("extEcts") + ' <input id="xects" type="number" min="0.5" max="60" step="0.5" value="5"></label><label>' + T("extSem") + ' <select id="xsem">' + semOpts + "</select></label>" +
      "<label>" + T("extCounts") + ' <select id="xrep"><option value="">' + T("extAsValg") + "</option>" + its.filter(function (it) { return it.grp !== "valg"; }).map(function (it) { return '<option value="' + esc(it.uid) + '">' + esc(T("extReplace", { n: it.optName || it.name })) + "</option>"; }).join("") + "</select></label>" +
      '<button type="button" class="btn" data-xadd="1">' + T("extAdd") + '</button> <button type="button" class="btn btn-ghost" data-xexch="1">' + T("exchange") + "</button></div>";
    // beståede RUC-aktiviteter
    h += "<h3>" + T("prevH") + '</h3><p class="small">' + T("prevLead") + "</p>";
    h += st.prev.length ? '<ul class="prevl">' + st.prev.map(function (id) { var a = act(id), u = matchPassed(id), it = u ? its.filter(function (x) { return x.uid === u; })[0] : null; return a ? '<li><span class="pn">' + esc(a.name) + " (" + esc(a.term) + ')</span><span class="tag tag-ok">' + (it ? esc(T("prevMatch", { n: it.optName || it.name })) : T("prevElective")) + '</span><span class="ec">' + fmt(a.ects) + ' ECTS</span><button type="button" class="rmb" data-prm="' + id + '">' + T("remove") + "</button></li>" : ""; }).join("") + "</ul>" : '<p class="small">' + T("prevNone") + "</p>";
    h += '<div class="find"><label class="vh" for="pq">' + T("prevQ") + '</label><input type="search" id="pq" autocomplete="off" placeholder="' + T("prevQ") + '" value="' + esc(ui.pq) + '"></div><div id="phits">' + prevHits() + "</div>";
    h += '<p class="small">' + T("meritRules") + "</p>";
    return h + stepNav(3);
  }
  function prevHits() {
    var q = ui.pq.trim().toLowerCase(); if (q.length < 2) return "";
    var seen = {}, hits = Object.keys(RUC.acts).filter(function (id) { var a = act(id); if (!a || a.ects <= 0 || st.prev.indexOf(id) >= 0 || a.name.toLowerCase().indexOf(q) < 0) return false; var k = norm(a.name); if (seen[k]) return false; seen[k] = 1; return true; }).slice(0, 12);
    return '<div class="clist">' + hits.map(function (id) { var a = act(id); return '<div class="pick"><span class="nm">' + esc(a.name) + more(id, a.name) + '</span><span class="ec">' + fmt(a.ects) + '</span><button type="button" class="addb" data-padd="' + id + '" aria-label="' + T("tPassed") + ": " + esc(a.name) + '">+</button></div>'; }).join("") + "</div>";
  }

  // ---------- hændelser ----------
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("button,[data-acc]") : null; if (!t) return;
    var g = function (a) { return t.getAttribute(a); };
    if (g("data-lang")) { pref.lang = g("data-lang"); }
    else if (g("data-go")) { pref.view = g("data-go"); window.scrollTo(0, 0); }
    else if (g("data-prog")) { if (pref.prog !== g("data-prog")) { pref.prog = g("data-prog"); st = blank(); } }
    else if (g("data-fag")) {
      var k = g("data-kind"), id = g("data-fag");
      if (k === "f2") { st.f2 = id; st.sem = {}; }
      else { st.f1 = id; st.one = k === "one"; st.f2 = null; st.ba = null; st.sem = {}; st.opt = {}; }
    }
    else if (g("data-bahost")) { st.ba = g("data-bahost"); }
    else if (g("data-spor")) { st.spor[g("data-slot")] = g("data-spor"); Object.keys(st.opt).forEach(function (k) { if (k.indexOf(g("data-slot") + ":") === 0) delete st.opt[k]; }); Object.keys(st.sem).forEach(function (k) { if (k.indexOf(g("data-slot") + ":") === 0) delete st.sem[k]; }); }
    else if (g("data-acc")) { var a = g("data-acc"); var cur = ui.open[a]; if (a.charAt(0) === "s" && cur === undefined) { var n = +a.slice(1); cur = n === 1; } ui.open[a] = !cur; }
    else if (g("data-grid")) { var gn = +g("data-grid"); ui.grid[gn] = !ui.grid[gn]; }
    else if (g("data-add")) { var an = +g("data-add"); ui.add = ui.add === an ? null : an; ui.q = ""; }
    else if (g("data-addel")) { var eid = g("data-addel"); if (st.el.indexOf(eid) < 0) st.el.push(eid); st.sem["v:" + eid] = +g("data-sem"); }
    else if (g("data-rm")) { var u = g("data-rm"); if (/^v:/.test(u)) st.el = st.el.filter(function (x) { return "v:" + x !== u; }); if (/^k:/.test(u)) { var pp = u.split(":"); st.pick[pp[1]] = (st.pick[pp[1]] || []).filter(function (i) { return String(i) !== pp[2]; }); } delete st.sem[u]; }
    else if (g("data-extra")) { st.extra = Math.max(0, Math.min(4, st.extra + (+g("data-extra")))); ui.open["s" + nSems()] = true; }
    else if (g("data-replan")) { if (ui.arm === "replan") { st.sem = {}; st.hold = {}; ui.arm = null; } else { ui.arm = "replan"; render(); return; } }
    else if (g("data-reset")) { if (ui.arm === "reset") { st = blank(); pref.prog = null; pref.view = "uddannelse"; ui.arm = null; } else { ui.arm = "reset"; render(); return; } }
    else if (g("data-xadd") || g("data-xexch")) {
      var exch = !!g("data-xexch"), e = Math.round((Number($("xects").value) || 0) * 2) / 2;
      if (exch) e = 30;
      if (e > 0 && e <= 60 && st.ext.length < 20) st.ext.push({ name: $("xname").value.trim().slice(0, 80) || (exch ? T("exchange") : ""), nr: $("xnr").value.trim().slice(0, 15), uni: $("xuni").value.trim().slice(0, 60), ects: e, sem: +$("xsem").value || 5, rep: exch ? "" : $("xrep").value });
    }
    else if (g("data-xrm")) { st.ext.splice(+g("data-xrm"), 1); }
    else if (g("data-padd")) { var pid = g("data-padd"); if (st.prev.indexOf(pid) < 0) st.prev.push(pid); }
    else if (g("data-prm")) { var r = g("data-prm"); st.prev = st.prev.filter(function (x) { return x !== r; }); }
    else return;
    if (!g("data-replan") && !g("data-reset")) ui.arm = null;
    render();
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target, g = function (a) { return t.getAttribute(a); };
    if (g("data-mv")) st.sem[g("data-mv")] = +t.value;
    else if (g("data-opt")) { st.opt[g("data-opt")] = +t.value; }
    else if (g("data-hold") !== null) { if (t.value) st.hold[g("data-hold")] = t.value; else delete st.hold[g("data-hold")]; }
    else if (g("data-pick")) { var k = g("data-pick"), i = +g("data-i"), l = st.pick[k] || []; if (t.checked && l.indexOf(i) < 0) l.push(i); if (!t.checked) l = l.filter(function (x) { return x !== i; }); st.pick[k] = l; ui.open["pk" + k] = true; }
    else return;
    render();
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "q") { ui.q = ev.target.value; var S = layout().sems[ui.add - 1]; if (S && $("plist")) { var tmp = document.createElement("div"); tmp.innerHTML = picker(S); $("plist").innerHTML = tmp.querySelector("#plist").innerHTML; } }
    if (ev.target.id === "pq") { ui.pq = ev.target.value; if ($("phits")) $("phits").innerHTML = prevHits(); }
  });

  // Testkrog (bruges af test.py)
  window.__ruc = { set: function (p, s) { pref.prog = p; st = Object.assign(blank(), s); }, layout: function () { return layout(); }, summary: function (P) { return summary(P); }, items: function () { return items(); } };
  load();
  render();
})();

</script>
</body>
