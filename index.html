<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kandidatplanlægger DTU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: fire trin, ét ad gangen. Lister er lukkede harmonikaer, så skærmen kun viser det, man er i gang med. Kursusnumre i mono som i kursusbasen. */
  --bg: #f2f3f7; --surface: #ffffff; --ink: #151926; --muted: #596073; --line: #dbdee8;
  --accent: #2f47d3; --accent-ink: #ffffff; --accent-soft: #e3e7fb;
  --ok: #15793f; --ok-bg: #dbf3e2; --info: #0b6f85; --info-bg: #d8eff5;
  --maybe: #6b3fc2; --maybe-bg: #ece5fa; --warn: #8a5a06; --warn-bg: #f9edcf; --none: #5b6273; --none-bg: #e5e7ee;
  --au: #9a4a12; --au-bg: #fbe7d6; --sp: #3f7414; --sp-bg: #e4f2d2; --bad: #b3261e; --bad-bg: #fbe1de;
  --s1: #7c8597; --s2: #2e9e6b; --s3: #d9772b; --s4: #c2478f; --s5: #8a63d2; --s6: #c9a227; --s7: #2f7fd3; --s8: #d1495b; --s9: #3aa6b9; --s10: #8d6e4a; --s11: #6b7f2a; --s12: #5b5bd6; --s13: #b39b12; --s14: #e07a9c;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1117; --surface: #181b24; --ink: #e8eaf2; --muted: #a0a7b8; --line: #2a2f3e;
    --accent: #8fa3ff; --accent-ink: #0c1130; --accent-soft: #222a4b;
    --ok: #6fd69b; --ok-bg: #133423; --info: #69d0e3; --info-bg: #0e3540;
    --maybe: #c3abf6; --maybe-bg: #2b2247; --warn: #edc468; --warn-bg: #3a2d0d; --none: #a3aabb; --none-bg: #242937;
    --au: #f0a875; --au-bg: #3d2413; --sp: #a6d977; --sp-bg: #1f3312; --bad: #ff9c92; --bad-bg: #47191a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1117; --surface: #181b24; --ink: #e8eaf2; --muted: #a0a7b8; --line: #2a2f3e;
  --accent: #8fa3ff; --accent-ink: #0c1130; --accent-soft: #222a4b;
  --ok: #6fd69b; --ok-bg: #133423; --info: #69d0e3; --info-bg: #0e3540;
  --maybe: #c3abf6; --maybe-bg: #2b2247; --warn: #edc468; --warn-bg: #3a2d0d; --none: #a3aabb; --none-bg: #242937;
    --au: #f0a875; --au-bg: #3d2413; --sp: #a6d977; --sp-bg: #1f3312; --bad: #ff9c92; --bad-bg: #47191a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.page { max-width: 820px; margin: 0 auto; padding: 20px 16px 56px; display: flex; flex-direction: column; gap: 18px; }

.top { display: flex; flex-direction: column; gap: 6px; }
.top h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.top p { color: var(--muted); max-width: 65ch; }
.unofficial { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; max-width: 80ch; }

.meters { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
body[data-view="kurser"] .meters { display: block; }
.mrow { display: flex; align-items: baseline; gap: 8px; }
.mrow .tv { font: 700 24px var(--display); font-variant-numeric: tabular-nums; }
.mrow .tl { font-size: 13px; color: var(--muted); }
.track { height: 6px; background: var(--none-bg); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 3px; }
.fill.full { background: var(--ok); }
.msub { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.msub .full { color: var(--ok); }

.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.step { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; padding: 9px 8px; background: none; border: 0; border-bottom: 3px solid var(--line); color: var(--muted); font: 500 14px var(--body); cursor: pointer; }
.step .sn { flex: none; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 600 12px var(--mono); background: var(--none-bg); color: var(--muted); }
.step .sl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step[aria-current] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.step[aria-current] .sn { background: var(--accent); color: var(--accent-ink); }
.step:disabled { opacity: 0.5; cursor: default; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.stepnav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 22px; }
.stepnav .btn { align-self: auto; }

.panels { display: grid; gap: 22px; }
.panel { display: none; min-width: 0; }
body[data-view="kurser"] #p-kurser, body[data-view="kandidater"] #p-kandidater, body[data-view="min-plan"] #p-min-plan, body[data-view="kandidatplan"] #p-kandidatplan { display: block; }
.panel > h2, #start h2 { font-size: 24px; margin-bottom: 6px; }
.lede { color: var(--muted); margin-bottom: 14px; max-width: 60ch; }

.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
.acch { width: 100%; display: flex; align-items: center; gap: 10px; padding: 13px 14px; background: none; border: 0; border-top: 1px solid var(--line); color: var(--ink); font: 500 15px var(--body); text-align: left; cursor: pointer; }
.acc > .acch:first-child { border-top: 0; }
.acch:hover { background: var(--accent-soft); }
.acch .t { flex: 1; min-width: 0; }
.acch .dot { margin-right: 8px; }
.acch .hint { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 6px; }
.acch .n { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
.acch .chev { flex: none; font-size: 18px; line-height: 1; color: var(--muted); transition: transform 0.15s; }
.acch[aria-expanded="true"] { font-weight: 600; }
.acch[aria-expanded="true"] .chev { transform: rotate(90deg); }
.acch.warnacc .n { background: var(--warn-bg); color: var(--warn); border-radius: 9px; padding: 1px 8px; }
.accb { padding: 2px 14px 12px; }
.accb .notes { padding-top: 4px; }
.linkbtn { background: none; border: 0; padding: 6px 0; color: var(--accent); font: 500 13px var(--body); text-decoration: underline; cursor: pointer; }
.req { display: block; color: var(--accent); }
.opens { font-size: 12px; color: var(--accent); padding: 0 6px 6px calc(18px + 3.4em + 26px); margin-top: -4px; }
@media (prefers-reduced-motion: reduce) { .acch .chev { transition: none; } }

.todo { background: var(--warn-bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 14px; }
.todo strong { color: var(--warn); }
.todo ul { margin: 4px 0 0; padding-left: 18px; }

.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.grp header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.grp h3 { font-size: 16px; }
.gsum { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
.grule { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }

.rows { display: flex; flex-direction: column; }
.crs { display: grid; grid-template-columns: 18px 3.4em minmax(0, 1fr) 2em; gap: 2px 10px; align-items: baseline; padding: 7px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 4px; }
.rows > .crs:first-child { border-top: 0; }
.crs:hover { background: var(--accent-soft); }
.crs input { margin: 0; width: 16px; height: 16px; accent-color: var(--accent); align-self: center; }
.crs .nr { font: 500 13px var(--mono); color: var(--muted); }
.crs .nm { overflow-wrap: anywhere; }
.crs.on .nm { font-weight: 500; }
.crs .sk { grid-column: 3 / 5; grid-row: 2; font-size: 12.5px; color: var(--muted); }
.crs .ec { grid-column: 4; grid-row: 1; font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.sea { display: inline-block; padding: 0 7px; border-radius: 9px; font: 600 11px var(--body); white-space: nowrap; vertical-align: 1px; }
.sea-E { background: var(--au-bg); color: var(--au); } .sea-F { background: var(--sp-bg); color: var(--sp); }
.semtag { margin-left: 8px; font: 500 11px var(--mono); color: var(--accent); white-space: nowrap; }
.clashline { font-size: 12px; font-weight: 500; color: var(--bad); padding: 0 6px 6px calc(18px + 3.4em + 26px); margin-top: -4px; }
.crs.bad .nr { color: var(--bad); }
.todo.bad { background: var(--bad-bg); } .todo.bad strong { color: var(--bad); }
.clash { background: var(--bad-bg); border-left: 3px solid var(--bad); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
.clash strong { color: var(--bad); }
.okline { font-size: 13px; font-weight: 500; color: var(--ok); }
.sems { display: flex; flex-direction: column; gap: 8px; }
.sem { min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.semh { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 0 2px; background: none; border: 0; color: var(--ink); font: 600 15px var(--display); text-align: left; cursor: pointer; }
.semh .t { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.semh .chev { flex: none; font-size: 18px; line-height: 1; color: var(--muted); transition: transform 0.15s; }
.semh[aria-expanded="true"] .chev { transform: rotate(90deg); }
.semsum { margin-top: -4px; }
.sem > .btn { align-self: flex-start; }
.sems + .btns, .btns + .btns, .btns + .small { margin-top: 10px; }
#p-kurser .btns + .small { margin-bottom: 14px; }
.rmb { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; font: 500 12px var(--body); color: var(--muted); cursor: pointer; }
.rmb:hover { color: var(--bad); border-color: var(--bad); }
.picker { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; }
.picker .find select { flex: 0 1 230px; max-width: 100%; padding: 8px; font: 400 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
.picks { display: flex; flex-direction: column; }
.pick { display: grid; grid-template-columns: 30px 3.4em minmax(0, 1fr) 2em; gap: 2px 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.picks > .pick:first-child { border-top: 0; }
/* Tilføj kursus: to grupper, så man kan se, hvad der hører til uddannelsen, og hvad der er frit valg. */
.pg { margin-top: 12px; border-radius: 8px; }
.pg-deg { background: var(--accent-soft); padding: 8px 10px 2px; border-left: 4px solid var(--accent); }
.pg-free { padding: 8px 10px 2px; border-left: 4px solid var(--line); }
.pgh { margin: 0; font: 600 14px var(--body); display: flex; align-items: center; gap: 7px; }
.pgdot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
.pg-free .pgdot { background: transparent; border: 2px solid var(--muted); }
.pgn { font: 500 12px var(--mono); color: var(--muted); }
.pgsub { margin: 2px 0 6px; font-size: 12.5px; color: var(--muted); }
.sembtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.sembtns .btn { margin: 0; }
.semsum .snr { font: 500 12px var(--mono); color: var(--ink); }
.si.si-ext { grid-template-columns: minmax(3.4em, max-content) minmax(0, 1fr) 2em; }
.si-ext .nr { font-size: 12px; white-space: nowrap; }
.si-ext .nr.arrow { font-size: 15px; color: var(--accent); }
.extform input.xnr { flex: 0 1 7.5em; font-family: var(--mono); }
.tag.tag-ext { background: var(--accent-soft); color: var(--accent); }
.extform { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; }
.extform .find { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.extform input[type="text"] { flex: 1 1 220px; min-width: 0; padding: 8px 10px; font: 400 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
/* Kandidatplan */
.mrow2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; padding: 6px 0 4px; font-weight: 600; }
.mrow2.sub { font-weight: 400; font-size: 13px; color: var(--muted); padding: 2px 0 2px 14px; }
.mrow2 .mv { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.mrow2 .mv.ok { color: var(--accent); }
.mrow2 .mbar { grid-column: 1 / 3; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.mrow2.sub .mbar { height: 3px; }
.mrow2 .mbar i { display: block; height: 100%; background: var(--accent); }
.semh.static { cursor: default; }
.semh.static:hover { background: none; }
.semtr { border-style: dashed; }
.tag.tag-ms { background: var(--accent-soft); color: var(--accent); }
.tag.tag-obl { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
/* Tilføj kursus: overskrift, små gruppeetiketter og lukkede kategorier, der åbnes én ad gangen. */
.pkh { margin: 0 0 8px; font: 600 14px var(--display); }
.pklab { margin: 14px 0 6px; font: 600 11px var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pcat.pcat-deg { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); font-weight: 600; }
.pcat.pcat-deg .dot { background: var(--accent); border-radius: 50%; }
.pcat .tag { margin-left: 8px; }
.pcatb .pgsub { margin: 8px 0 2px; }
.pcatb .pick:first-of-type { border-top: 0; }
.pall { display: block; margin: 6px 0 8px; }
@media (min-width: 640px) {
  .picker .pick { grid-template-columns: 30px 3.4em minmax(0, 1.5fr) minmax(0, 1fr) 2em; align-items: center; padding: 6px 0; }
  .picker .pick .sk { grid-column: 4; grid-row: 1; }
  .picker .pick .ec { grid-column: 5; grid-row: 1; }
}
.pgbtn { width: 100%; display: flex; align-items: center; gap: 7px; padding: 2px 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.pgbtn .chev, .pcat .chev { margin-left: auto; flex: none; font-size: 18px; line-height: 1; color: var(--muted); transition: transform 0.15s; }
.pgbtn[aria-expanded="true"] .chev, .pcat[aria-expanded="true"] .chev { transform: rotate(90deg); }
.pcats { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.pcat { width: 100%; display: flex; align-items: center; gap: 9px; padding: 10px 12px; background: none; border: 0; border-top: 1px solid var(--line); color: var(--ink); font: 500 14px var(--body); text-align: left; cursor: pointer; }
.pcats > .pcat:first-child { border-top: 0; }
.pcat:hover { background: var(--accent-soft); }
.pcat[aria-expanded="true"] { background: var(--bg); }
.pcat .t { flex: 1; min-width: 0; }
.pcat .chev { margin-left: 0; }
.pcatb { padding: 0 12px 4px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .pgbtn .chev, .pcat .chev { transition: none; } }
.pick .nr { font: 500 13px var(--mono); color: var(--muted); }
.pick .nm { overflow-wrap: break-word; hyphens: auto; }
.pick .ec { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.pick .sk { grid-column: 3 / 5; font-size: 12.5px; color: var(--muted); }
.addb { grid-row: 1 / 3; align-self: center; width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font: 600 18px/1 var(--body); cursor: pointer; }
.addb:hover { background: var(--accent); color: var(--accent-ink); }
.pclash { display: block; color: var(--bad); font-weight: 500; }
.sem.hasclash { border-color: var(--bad); }
.sem header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sem h4 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
.gsum.over { color: var(--warn); }
.sis { display: flex; flex-direction: column; }
.si { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) 2em; gap: 3px 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
.sis > .si:first-child { border-top: 0; }
.si .nr { font: 500 13px var(--mono); color: var(--muted); }
.si .nm { overflow-wrap: break-word; hyphens: auto; font-weight: 500; }
.si .ec { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.si .sk { grid-column: 2 / 4; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; font-size: 12.5px; color: var(--muted); }
.si.bad .tm { color: var(--bad); font-weight: 600; }
.si .contd { font-size: 12px; }
.si .ctl { display: inline-flex; align-items: center; gap: 6px; }
.si .mvs { max-width: 5.6em; color: var(--muted); padding: 2px 4px; cursor: pointer; }
.si select { max-width: 100%; font: 500 12px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.tabbadge { display: inline-block; min-width: 18px; text-align: center; font: 600 11px var(--mono); background: var(--bad); color: var(--surface); border-radius: 9px; padding: 0 5px; margin-left: 4px; }
.tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 500; background: var(--none-bg); color: var(--none); vertical-align: 1px; }
.tag-maybe { background: var(--maybe-bg); color: var(--maybe); }
.num { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.num input { width: 5.5em; padding: 5px 6px; font: 500 14px var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }

.tally { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip-sikker { background: var(--ok-bg); color: var(--ok); }
.chip-opfyldt { background: var(--info-bg); color: var(--info); }
.chip-maybe { background: var(--maybe-bg); color: var(--maybe); }
.chip-mangler { background: var(--warn-bg); color: var(--warn); }
.chip-info { background: var(--none-bg); color: var(--none); }
h3.uni { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; font-family: var(--body); font-weight: 600; }

.ms { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--none); border-radius: 8px; margin-bottom: 8px; }
.ms-sikker { border-left-color: var(--ok); } .ms-opfyldt { border-left-color: var(--info); } .ms-maybe { border-left-color: var(--maybe); } .ms-mangler { border-left-color: var(--warn); }
.mshead { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 0; }
.mstoggle { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 10px 4px 10px 12px; color: inherit; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
.msname { font-weight: 600; overflow-wrap: anywhere; }
.mssub { font-size: 13px; color: var(--muted); }
.wish { background: none; border: 1px solid var(--line); border-radius: 6px; width: 32px; height: 32px; font-size: 16px; line-height: 1; color: var(--muted); cursor: pointer; flex: none; }
.wish[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.msbody { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.msbody .en { font-size: 13px; color: var(--muted); font-style: italic; }
.msbody h4 { font-size: 14px; margin-top: 4px; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rule { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.rhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.rmark { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; }
.rule-ok .rmark { background: var(--ok-bg); color: var(--ok); } .rule-maybe .rmark { background: var(--maybe-bg); color: var(--maybe); } .rule-no .rmark { background: var(--warn-bg); color: var(--warn); }
.rlabel { font-weight: 500; flex: 1; min-width: 12ch; }
.rprog { font: 500 12px var(--mono); color: var(--muted); }
.cov, .rnote { font-size: 13px; color: var(--muted); margin-top: 4px; }
.flag { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 14px; cursor: pointer; }
.flag input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.notes { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.src { font-size: 12px; color: var(--muted); }
.btn { align-self: flex-start; background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 7px; padding: 8px 12px; font: 600 14px var(--body); cursor: pointer; }
.btn-ghost { background: none; color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 17px; }
.card h4 { font-size: 14px; }
.card p { max-width: 70ch; }
.wl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.wl li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.unitag { font: 500 11px var(--mono); color: var(--muted); }
.budget { font-size: 14px; }
.small { font-size: 13px; color: var(--muted); }
.grids { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.gridwrap { overflow-x: auto; }
.grid { width: 100%; min-width: 300px; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
.grid caption { text-align: left; font: 600 14px var(--display); padding-bottom: 4px; }
.grid th { font-weight: 500; color: var(--muted); padding: 3px; text-align: center; }
.grid tbody th { width: 3.4em; text-align: right; padding-right: 6px; font-family: var(--mono); }
.grid td { border: 1px solid var(--line); vertical-align: top; padding: 4px; height: 58px; }
.grid td.bad { background: var(--bad-bg); outline: 2px solid var(--bad); outline-offset: -2px; }
.sem .grid { min-width: 250px; } .sem .grid td { height: 34px; }
.mod { display: block; font: 400 10px var(--mono); color: var(--muted); }
.cn { display: inline-block; font: 500 11px var(--mono); padding: 0 4px; margin: 1px 2px 0 0; border-radius: 4px; background: var(--accent-soft); color: var(--ink); border: 1px solid transparent; }
.cn.alt { background: none; border: 1px dashed var(--muted); color: var(--muted); }
textarea { width: 100%; font: 400 12px var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }

.toprow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: none; color: var(--muted); font: 500 13px var(--body); padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.bachbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 6px; }
.bachbar .bl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.btn-sm { padding: 4px 10px; font-size: 13px; }
#start { display: none; }
body[data-view="start"] #start { display: block; }
body[data-view="start"] .panels { display: none; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.bpick { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--ink); font: 500 15px var(--body); cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.bpick:hover, .bpick.cur { border-color: var(--accent); background: var(--accent-soft); }
.bpick:disabled { opacity: 0.55; cursor: default; background: var(--surface); border-color: var(--line); }
.upick .bn { font: 700 22px var(--display); }
.upick .us { font-size: 13px; font-weight: 400; color: var(--muted); }
.unibar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-bottom: 12px; }
.unote { margin-bottom: 8px; max-width: 70ch; }
.tag-full { margin-left: 0; background: var(--ok-bg); color: var(--ok); }
.sech { font-size: 18px; margin: 18px 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; padding: 4px 11px; font: 500 13px var(--body); cursor: pointer; }
.fchip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fchip .cnt { font: 500 11px var(--mono); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 0 5px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--sc, var(--none)); flex: none; }
.grp.subj { border-left: 4px solid var(--sc, var(--line)); }
.grp.subj h3 { display: flex; align-items: center; gap: 8px; }
.s-basis { --sc: var(--s1); } .s-miljo { --sc: var(--s2); } .s-kemi { --sc: var(--s3); } .s-bio { --sc: var(--s4); } .s-proces { --sc: var(--s5); }
.s-mek { --sc: var(--s10); } .s-byg { --sc: var(--s11); } .s-el { --sc: var(--s12); } .s-energi { --sc: var(--s13); } .s-sund { --sc: var(--s14); }
.find { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.find input { flex: 1 1 220px; min-width: 0; padding: 8px 10px; font: 400 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
.find .btn { align-self: center; }
.hits { margin-bottom: 8px; }
.s-food { --sc: var(--s6); } .s-data { --sc: var(--s7); } .s-biz { --sc: var(--s8); } .s-fys { --sc: var(--s9); }
.chip-betinget { background: var(--info-bg); color: var(--info); }
.ms-betinget { border-left-color: var(--info); }
.infotoggle { margin-top: 14px; }
.foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 520px) {
  .mshead { flex-wrap: wrap; }
  .mstoggle { flex: 1 1 calc(100% - 52px); }
  .mshead .chip { order: 3; margin: -4px 0 10px 12px; }
  .step { flex-direction: column; gap: 4px; font-size: 12px; padding: 6px 2px 8px; }
  .panel > h2, #start h2 { font-size: 21px; }
}

/* Tilgængelighed: større trykflader, tydeligere felter, læsbar mindste-tekst */
:root { --field-line: #80879a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --field-line: #6b7388; } }
:root[data-theme="dark"] { --field-line: #6b7388; }
input, select, .rmb, .wish { border-color: var(--field-line); }
.crs .nm { overflow-wrap: break-word; hyphens: auto; }
.sea, .semtag, .pklab, .tag, .rmark, .cn { font-size: 12px; }
.tag.tag-obl { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.semh { min-height: 44px; }
.rmb, .si .mvs { min-height: 32px; }
.addb { width: 36px; height: 36px; }
.lang button, .btn-sm { min-height: 36px; }
.semsum[data-semopen] { cursor: pointer; }
@media (max-width: 520px) { .rmb, .si .mvs { min-height: 40px; } }

/* Tema (valgt ved afstemning) */
/* ==========================================================================
   Design B — "Swiss engineering poster"
   Sort/hvid papir, ét signal-orange, stramt grid, store tal, mono kursusnumre.
   --signal = flader (altid med sort tekst); --accent = tekst-sikker mørk orange.
   ========================================================================== */
:root {
  color-scheme: light;
  --bg: #f0efea; --surface: #ffffff; --ink: #0d0d0d; --muted: #55534e; --line: #d4d2cb;
  --rule: #0d0d0d;            /* strukturelle linjer: kort, faner, rammer */
  --bar: #0d0d0d;             /* de tykke plakat-streger */
  --on-ink-accent: #ff4f00;   /* orange tekst/markør på ink-flade */
  --signal: #ff4f00; --signal-ink: #0d0d0d;
  --accent: #b83300; --accent-ink: #ffffff; --accent-soft: #e6e4dd;   /* neutral hover-tone, ikke fersken */
  --focus: #d93d00;
  --inv-bg: #0d0d0d; --inv-ink: #f0efea; --inv-muted: #b5b3ac; --inv-line: #3a3936; --inv-tick: #6e6c66;
  --btn-bg: #0d0d0d; --btn-ink: #ffffff;
  --field-line: #6e6c66;
  --ok: #12703a; --ok-bg: #d9f0df; --info: #0a6478; --info-bg: #d6ecf2;
  --maybe: #6236b8; --maybe-bg: #ebe4f8; --warn: #b83300; --warn-bg: var(--surface); --none: #4f4d48; --none-bg: #e4e2dc;
  --au: #8a3b12; --au-bg: #8a3b12; --au-ink: #ffffff; --sp: #2f6a12; --sp-bg: #2f6a12; --sp-ink: #ffffff;
  --bad: #b3261e; --bad-bg: #fbe1de;
  --display: "Archivo", "Inter Display", "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  --body: "Archivo", "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0b0b; --surface: #161616; --ink: #f2f1ec; --muted: #a9a7a0; --line: #34332f;
    --rule: #8d8b84; --bar: #f2f1ec; --on-ink-accent: #b83300;
    --signal: #ff5a1f; --signal-ink: #0b0b0b;
    --accent: #ff6a2b; --accent-ink: #0b0b0b; --accent-soft: #262624;
    --focus: #ff7a3d;
    --inv-bg: #161616; --inv-ink: #f2f1ec; --inv-muted: #a9a7a0; --inv-line: #3a3936; --inv-tick: #77756e;
    --btn-bg: #f2f1ec; --btn-ink: #0b0b0b;
    --field-line: #77756e;
    --ok: #6fd69b; --ok-bg: #12301f; --info: #69d0e3; --info-bg: #0d323c;
    --maybe: #c3abf6; --maybe-bg: #2a2144; --warn: #ff6a2b; --warn-bg: var(--surface); --none: #a9a7a0; --none-bg: #262624;
    --au: #f0a875; --au-bg: #f0a875; --au-ink: #1a0d04; --sp: #a6d977; --sp-bg: #a6d977; --sp-ink: #0f1a06;
    --bad: #ff9c92; --bad-bg: #44181a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0b0b; --surface: #161616; --ink: #f2f1ec; --muted: #a9a7a0; --line: #34332f;
  --rule: #8d8b84; --bar: #f2f1ec; --on-ink-accent: #b83300;
  --signal: #ff5a1f; --signal-ink: #0b0b0b;
  --accent: #ff6a2b; --accent-ink: #0b0b0b; --accent-soft: #262624;
  --focus: #ff7a3d;
  --inv-bg: #161616; --inv-ink: #f2f1ec; --inv-muted: #a9a7a0; --inv-line: #3a3936; --inv-tick: #77756e;
  --btn-bg: #f2f1ec; --btn-ink: #0b0b0b;
  --field-line: #77756e;
  --ok: #6fd69b; --ok-bg: #12301f; --info: #69d0e3; --info-bg: #0d323c;
  --maybe: #c3abf6; --maybe-bg: #2a2144; --warn: #ff6a2b; --warn-bg: var(--surface); --none: #a9a7a0; --none-bg: #262624;
  --au: #f0a875; --au-bg: #f0a875; --au-ink: #1a0d04; --sp: #a6d977; --sp-bg: #a6d977; --sp-ink: #0f1a06;
  --bad: #ff9c92; --bad-bg: #44181a;
}

/* ---------- Grundlag ---------- */
body { font: 400 15px/1.5 var(--body); letter-spacing: -0.003em; font-feature-settings: "ss01"; }
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -0.02em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 0; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.page { max-width: 880px; padding: 24px 16px 64px; gap: 22px; }

/* Firkantede hjørner overalt */
.meters, .acc, .grp, .sem, .picker, .extform, .pcats, .pg, .ms, .rule, .card, .bpick, .btn, .lang, .rmb, .wish,
.todo, .clash, .find input, .extform input[type="text"], .picker .find select, .si select, .num input, textarea,
.fchip, .chip, .tag, .sea, .rmark, .cn, .tabbadge, .fchip .cnt, .crs, .track, .fill, .mrow2 .mbar, .acch.warnacc .n { border-radius: var(--r); }

/* ---------- Hoved ---------- */
.top { gap: 10px; padding-bottom: 18px; border-bottom: 6px solid var(--bar); }
.toprow { align-items: flex-end; }
.toprow > h1 { flex: 1 1 auto; }
.top h1 {
  font: 800 clamp(26px, 5.4vw, 46px)/0.95 var(--display); font-stretch: 112%;
  letter-spacing: -0.035em; text-transform: uppercase; overflow-wrap: anywhere; min-width: 0; max-width: 100%;
  display: flex; align-items: flex-start; gap: 0.22em;
}
.top h1::before { content: ""; flex: none; width: 0.62em; height: 0.62em; margin-top: 0.12em; background: var(--signal); }
.top p { font-size: 17px; line-height: 1.45; color: var(--ink); max-width: 58ch; }
.lang { border: 2px solid var(--rule); background: var(--surface); }
.lang button { font: 600 12px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); padding: 6px 12px; }
.lang button + button { border-left: 2px solid var(--rule); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- Trin-faner ---------- */
.tabs { display: flex; gap: 0; border: 2px solid var(--rule); background: var(--surface); }
.step {
  position: relative; flex: 1 1 0; justify-content: flex-start; gap: 10px; padding: 10px 12px; min-height: 52px;
  border: 0; border-left: 2px solid var(--rule); color: var(--ink); font: 600 14px var(--body); text-align: left;
}
.step:first-child { border-left: 0; }
.step .sn { width: auto; height: auto; border-radius: 0; background: none; color: var(--muted); font: 600 13px var(--mono); }
.step .sn::before { content: "0"; }
.step:not(:disabled):not([aria-current]):hover { background: var(--accent-soft); box-shadow: inset 0 -4px 0 var(--signal); }
.step[aria-current] { background: var(--ink); color: var(--bg); border-bottom: 0; }
.step[aria-current] .sn { background: none; color: var(--on-ink-accent); }
.step:disabled { opacity: 1; color: var(--muted); background: var(--surface); font-weight: 500; }
.step .tabbadge { margin-left: auto; }

/* ---------- Trinoverskrift ---------- */
.eyebrow { display: flex; align-items: center; gap: 8px; font: 600 12px var(--mono); letter-spacing: 0.06em; color: var(--ink); margin-bottom: 8px; }
.eyebrow::before { content: ""; width: 10px; height: 10px; background: var(--signal); flex: none; }
.panel > h2, #start h2 { font: 800 clamp(28px, 5vw, 40px)/1.02 var(--display); letter-spacing: -0.03em; margin-bottom: 10px; }
.lede { font-size: 16px; color: var(--ink); opacity: 1; max-width: 58ch; margin-bottom: 18px; }
.sech { font: 800 22px var(--display); letter-spacing: -0.02em; margin: 26px 0 6px; }

/* ---------- ECTS-tæller: plakatens blikfang ---------- */
.meters { background: var(--inv-bg); color: var(--inv-ink); border: 2px solid var(--rule); padding: 16px 18px 14px; }
.mrow { gap: 12px; align-items: baseline; flex-wrap: wrap; }
.mrow .tv { font: 800 clamp(56px, 13vw, 88px)/0.85 var(--display); font-stretch: 85%; letter-spacing: -0.04em; color: var(--signal); }
.mrow .tl { font: 600 13px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--inv-ink); }
/* Bjælken = 180 ECTS, delt i 6 felter à 30 ECTS (ét pr. semester). Hakkene skærer også gennem den orange fyldning. */
.mrow::after { content: "6 × 30 ECTS"; margin-left: auto; align-self: flex-end; font: 600 11px var(--mono); letter-spacing: 0.04em; color: var(--inv-muted); }
.track { height: 16px; margin-top: 14px; border: 2px solid var(--inv-ink); position: relative; background: var(--inv-bg); }
.track::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 6 - 2px), var(--inv-tick) calc(100% / 6 - 2px) calc(100% / 6));
}
.fill { background: var(--signal); }
.fill.full { background: var(--ok); }
.msub {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 14px;
  border-top: 1px solid var(--inv-line); font: 500 12.5px/1.35 var(--body); color: var(--inv-muted);
}
.msub > span { display: flex; align-items: center; gap: 7px; padding: 8px 10px 0 0; color: var(--inv-ink); white-space: nowrap; }
.msub > span + span { padding-left: 10px; border-left: 1px solid var(--inv-line); }
/* Afkrydsningsfelt: tom ramme = mangler endnu, orange felt med ✓ = opfyldt */
.msub > span::before {
  content: ""; flex: none; width: 13px; height: 13px; box-sizing: border-box; border: 2px solid var(--inv-muted);
  display: inline-flex; align-items: center; justify-content: center; font: 900 10px/1 var(--body);
}
.msub .full { font-weight: 700; }
.msub > .full::before { content: "✓"; background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
:root .meters .msub .full { color: var(--inv-ink); }

/* ---------- Knapper ---------- */
.btn { background: var(--btn-bg); color: var(--btn-ink); border: 2px solid var(--btn-bg); padding: 9px 14px; font: 700 14px var(--body); letter-spacing: 0.01em; min-height: 40px; }
.btn:hover { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn-ghost:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn-sm { padding: 5px 11px; font-size: 13px; min-height: 36px; }
.linkbtn { color: var(--accent); font-weight: 600; min-height: 32px; }
.rmb { border: 1.5px solid var(--field-line); color: var(--ink); font: 600 12px var(--body); }
.rmb:hover { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }

/* ---------- Start: bachelorgitter ---------- */
.bgrid { gap: 0; padding: 0 2px 2px 0; }
.bpick {
  position: relative; margin: 0 -2px -2px 0; border: 2px solid var(--rule); background: var(--surface);
  justify-content: center; padding: 10px 40px 10px 14px; gap: 4px; min-height: 56px; font: 600 15.5px/1.25 var(--body); letter-spacing: -0.01em;
}
.bpick::after { content: "→"; position: absolute; right: 14px; top: 50%; margin-top: -0.65em; font: 600 16px/1.3 var(--mono); color: var(--muted); transition: transform 0.12s; }
.bpick:hover { z-index: 1; background: var(--accent-soft); border-color: var(--rule); box-shadow: inset 4px 0 0 var(--signal); }
.bpick:hover::after { color: var(--ink); transform: translateX(3px); }
.bpick.cur, .bpick.cur:hover { z-index: 1; background: var(--signal); border-color: var(--rule); color: var(--signal-ink); }
.bpick.cur::after { color: var(--signal-ink); }
.bpick.cur, .bpick.cur:hover { box-shadow: none; }
.bpick:focus-visible { z-index: 2; }
.bpick:disabled, .bpick:disabled:hover { background: var(--bg); border-color: var(--rule); color: var(--muted); box-shadow: none; }
.upick .bn { font: 800 28px var(--display); letter-spacing: -0.03em; }
h3.uni { font: 600 12px var(--mono); letter-spacing: 0.06em; color: var(--ink); margin: 26px 0 8px; display: flex; align-items: center; gap: 8px; }
h3.uni::after { content: ""; flex: 1; height: 2px; background: var(--rule); }
@media (prefers-reduced-motion: reduce) { .bpick::after { transition: none; } }

/* ---------- Harmonikaer, kort, grupper ---------- */
.acc, .grp, .card, .picker, .extform, .ms { border: 2px solid var(--rule); }
.acch { min-height: 48px; font: 600 15px var(--body); border-top: 1.5px solid var(--line); }
.acch:hover, .pcat:hover, .crs:hover { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--signal); }
.acch .n, .pgn, .gsum, .rprog { font-family: var(--mono); font-weight: 600; color: var(--ink); }

.acch.warnacc .n, .chip-mangler, .rule-no .rmark, .gsum.over { background: transparent; color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--warn); }
.acch.warnacc .n { padding: 2px 8px; font-weight: 700; }
.chev, .acch .chev, .semh .chev, .pgbtn .chev, .pcat .chev { color: var(--ink); font-weight: 700; }
.grp h3 { font-size: 17px; }
.card h3 { font: 800 19px var(--display); letter-spacing: -0.02em; }

/* ---------- Semestre ---------- */
.okline { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--mono); letter-spacing: 0.02em; color: var(--ok); }
.okline::before { content: "✓"; font-weight: 800; }
.sems { gap: 0; }
.sem { background: var(--surface); border: 2px solid var(--rule); margin-top: -2px; padding: 4px 14px 12px; }
.sems > .sem:first-child { margin-top: 0; }
.sem.hasclash { border-color: var(--bad); position: relative; z-index: 1; box-shadow: inset 4px 0 0 var(--bad); }
.semh { font: 800 17px var(--display); letter-spacing: -0.015em; text-transform: uppercase; }
.semh:hover .chev { color: var(--accent); }
.sea { padding: 1px 6px; font: 600 12px/1.5 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; vertical-align: 2px; }
.sea-E { background: var(--au-bg); color: var(--au-ink); }
.sea-F { background: var(--sp-bg); color: var(--sp-ink); }
.sea-E::before { content: "◐ "; } .sea-F::before { content: "◑ "; }
.gsum { font-size: 13px; }
.gsum.over { padding: 0 6px; }
.semsum { color: var(--muted); line-height: 1.6; }
.semsum .snr { font: 600 12px var(--mono); color: var(--ink); }
.semtr { border-style: dashed; }
.si { border-top: 1.5px solid var(--line); padding: 9px 0; }
.si .nr, .crs .nr, .pick .nr { font: 600 13px var(--mono); color: var(--ink); letter-spacing: -0.01em; }
.si .nm { font-weight: 600; }
.si .ec, .crs .ec, .pick .ec { font: 700 13px var(--mono); }
.tag { padding: 0 6px; font: 600 12px/1.6 var(--mono); letter-spacing: 0.02em; background: var(--none-bg); color: var(--none); }
.tag.tag-obl { background: var(--ink); color: var(--bg); }
.tag.tag-ext, .tag.tag-ms { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.tabbadge { background: var(--bad); color: var(--surface); border-radius: 0; font-weight: 700; }
.clash { border-left: 4px solid var(--bad); }
.todo { background: var(--surface); border: 2px solid var(--rule); border-left: 6px solid var(--warn); }
.todo.bad { background: var(--bad-bg); border-left-color: var(--bad); }

/* ---------- Tilføj kursus ---------- */
.picker { background: var(--surface); padding: 12px 14px; }
.pkh { font: 800 16px var(--display); letter-spacing: -0.015em; }
.pklab { font: 600 11px var(--mono); letter-spacing: 0.06em; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.pklab::after { content: ""; flex: 1; height: 1.5px; background: var(--rule); }
.find input, .extform input[type="text"], .picker .find select { border: 2px solid var(--field-line); padding: 9px 11px; min-height: 42px; }
.find input:focus-visible, .extform input:focus-visible { border-color: var(--ink); }
.pcats { border: 2px solid var(--rule); }
.pcat { min-height: 44px; font-weight: 500; border-top: 1.5px solid var(--line); }
.pcat[aria-expanded="true"] { background: var(--accent-soft); font-weight: 700; box-shadow: inset 6px 0 0 var(--ink); }
.pcat[aria-expanded="true"] + .pcatb { border-top: 2px solid var(--ink); }

.pgdot { border-radius: 0; background: var(--signal); }
.pgh { font-family: var(--display); font-weight: 700; }
.pick { border-top: 1.5px solid var(--line); }

.chip { padding: 2px 8px; font: 600 11.5px/1.5 var(--mono); letter-spacing: 0.02em; text-transform: uppercase; }

.msname { font: 700 15.5px var(--display); letter-spacing: -0.01em; }
.wish { border: 2px solid var(--field-line); width: 36px; height: 36px; color: var(--ink); }
.wish[aria-pressed="true"] { background: var(--signal); border-color: var(--ink); color: var(--signal-ink); }
.rule { border: 1.5px solid var(--line); }
.rmark { font: 600 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: 0.03em; }

/* ---------- Kandidatplan-målere ---------- */

.mrow2 .mv.ok { color: var(--ok); }
.mrow2 .mbar { height: 8px; background: var(--line); }
.mrow2.sub .mbar { height: 4px; }
.mrow2 .mbar i { background: var(--signal); }

/* ---------- Skema ---------- */
.grid caption { font: 800 15px var(--display); }
.grid td { border: 1.5px solid var(--line); }
.cn { background: var(--accent-soft); font-weight: 600; }
.chip, .rmark { font-size: 12px; }

/* ---------- Fod ---------- */
.foot { border-top: 6px solid var(--bar); padding-top: 14px; color: var(--muted); font-size: 12.5px; }
.foot p:first-child { color: var(--ink); font-weight: 600; }

/* ---------- Mobil ---------- */
@media (max-width: 860px) {
  .msub { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .msub > span:nth-child(3) { border-left: 0; padding-left: 0; }
  .msub > span:nth-child(n+3) { border-top: 1px solid var(--inv-line); margin-top: 8px; }
}
@media (max-width: 520px) {
  /* Én kategori pr. linje, så intet ombrydes */
  .msub { grid-template-columns: minmax(0, 1fr); margin-top: 12px; }
  .msub > span:nth-child(n) { padding: 7px 0; border-left: 0; margin-top: 0; white-space: normal; font-size: 13.5px; }
  .msub > span:nth-child(n+2) { border-top: 1px solid var(--inv-line); }
  .msub > span:last-child { padding-bottom: 0; }
  .mrow::after { flex-basis: 100%; margin: 6px 0 -4px; text-align: left; }
}
/* Smalle skærme: inaktive trin viser kun nummeret, det aktive trin får hele navnet. Navnet bliver i tilgængelighedstræet. */
@media (max-width: 760px) {

  .step .sn { font-size: 13px; }

  .step[aria-current] { flex: 0 0 auto; padding: 8px 14px; }
  .step .tabbadge { margin-left: 0; }
}
@media (max-width: 380px) {
  .step { min-width: 36px; gap: 5px; }
  .step[aria-current] { padding: 8px 9px; }
}
@media (max-width: 520px) {
  .page { padding: 16px 12px 48px; gap: 18px; }
  .top { border-bottom-width: 5px; }
  .top h1 { font-size: clamp(19px, 7.2vw, 28px); font-stretch: 84%; letter-spacing: -0.02em; }
  .panel > h2, #start h2 { font-size: 28px; }
  .bpick { min-height: 48px; padding: 9px 38px 9px 12px; font-size: 15px; }
}

</style>

      return '<ul class="notes">' + S0.warn.map(function (w) { return "<li>" + esc(T(w[0], { 0: typeof w[1] === "object" ? L(w[1]) : w[1], 1: w[2], 2: w[3] })) + "</li>"; }).join("") + "</ul>" + (note ? '<p class="small">' + esc(L(note)) + "</p>" : "");
    }, "warnacc") + "</div>";

      '<div class="sems">' + SP.sems.map(semCard).join("") + "</div>" +
      '<div class="btns">' + (st.extra < 4 ? '<button type="button" class="btn btn-ghost" id="addsemester" data-extra="1">+ ' + T("addSemX") + "</button>" : "") +
      (st.extra > 0 && !SP.sems[SP.sems.length - 1].items.length && !extIn(6 + st.extra).length ? '<button type="button" class="btn btn-ghost" id="rmsemester" data-extra="-1">' + T("rmSemX", { n: 6 + st.extra }) + "</button>" : "") + "</div>" +
      '<div class="btns"><button type="button" class="btn btn-ghost" id="gridtoggle" data-grid="1" aria-expanded="' + ui.showGrid + '">' + T(ui.showGrid ? "hideGrid" : "showGrid") + "</button>" +
      '<button type="button" class="btn btn-ghost" id="replan" data-replan="1">' + T(ui.rpArm ? "replan2" : "replan") + "</button></div>" +
      '<p class="small">' + T("spNote") + " " + T("pointNote") + "</p>";
    if (hasStudy(B0)) html += '<div class="acc">' + acc("other", T("other"), "", st.other ? st.other + " ECTS" : "", function () {
      return '<p class="grule">' + T("otherLead") + '</p><p class="grule">' + T("otherKU") + "</p>" +
        '<label class="num" for="other">ECTS <input type="number" id="other" min="0" max="' + NEED.valg + '" step="2.5" value="' + st.other + '"></label>';
    }) + "</div>";

  // ---------- kandidater ----------
  function chip(m, r) {
    var t, p = r.plan;
    if (r.status === "sikker") t = p.acc.type === "r" ? T(!isDtu() && p.acc.qual ? "cRetQ" : "cRet") : (m.uni === "DTU" ? T("cDir") : T("cKU"));
    else if (r.status === "opfyldt") t = m.kind === "kurser" ? T("cKurs") : T("cSoeg");
    else if (r.status === "maybe") t = T("cMaybe");
    else if (r.status === "mangler") t = T("cMangler", { n: r.missing });
    else if (r.status === "betinget") t = T("cBet");
    else t = m.uni === "DTU" ? T("cInd") : T("cNo");
    return '<span class="chip chip-' + r.status + '">' + esc(t) + "</span>";
  }
  function quals(p, type) {
    var seen = {}, out = [];
    p.all.forEach(function (x) { if (x.type === (type || p.acc.type) && x.qual && !seen[x.qual]) { seen[x.qual] = 1; out.push(x.qual); } });
    return out.join(T("eller"));
  }
  // Retskrav, der kun gælder i en fagkombination, selv om faget alene er forhåndsgodkendt (RUC)
  function extraRight(p) { return !isDtu() && p.acc && p.acc.type !== "r" ? quals(p, "r") : ""; }
  function subline(m, r, sug) {
    var p = r.plan;
    if (r.status === "sikker") {
      if (extraRight(p)) return T("sRightIf", { q: extraRight(p) });
      if (p.acc.qual) return T(isDtu() ? "sOnly" : "sOnlyX", { q: isDtu() ? p.acc.qual : quals(p) });
      return p.acc.type === "r" ? T("sRet") : (m.uni === "DTU" ? T("sDir") : T("sKU"));
    }
    if (r.status === "opfyldt") return m.kind === "kurser" ? T("sKurs") : T("sVurd");
    if (r.status === "maybe") return T("sMaybe");
    if (r.status === "mangler") {
      if (sug.length) { var e = 0; sug.forEach(function (id) { e += E.ects(id); }); return T("sAdd", { c: sug.map(nr).join(", "), e: e }); }
      return T("sNoFix");
    }
    if (r.status === "betinget") return m.uni !== "DTU" && p.cond ? L(p.cond) : T("sBet");
    return m.uni === "DTU" ? T("sInd") : T("sSee");
  }

  function ruleHtml(m, r, i, res) {
    var key = m.id + ":" + i;
    var state = res.ok === true ? "ok" : (res.ok === "maybe" ? "maybe" : "no");
    var prog = "";
    if (r.kind === "ects") prog = T("pEcts", { a: res.have, b: r.min });
    if (r.kind === "count") prog = T("pCount", { a: res.have, b: r.min }) + (res.must ? "" : T("pMust", { c: r.must.map(nr).join(T("eller")) }));
    var body = "";
    if (r.kind === "flag") {
      var fid = "f-" + m.id + "-" + r.flag;
      body = '<label class="flag" for="' + fid + '"><input type="checkbox" id="' + fid + '" data-flag="' + r.flag + '"' + (st.flags[r.flag] ? " checked" : "") + "> " + esc(L(KP.flags[r.flag])) + "</label>";
    } else {
      var maybeSet = {}; (r.maybe || []).forEach(function (id) { maybeSet[id] = 1; });
      var opts = r.kind === "one" ? (r.any || []).concat(r.maybe || []) : (r.kind === "ects" ? (r.from || []).concat(r.maybe || []) : [].concat.apply([], r.slots));
      if (res.ok === true) {
        var used = opts.filter(function (id) { return st.c.indexOf(id) >= 0 && !maybeSet[id]; }).map(nr);
        if (res.supp) used.push(T("suppEcts", { n: res.supp }));
        body = '<p class="cov">' + esc(T("cov", { c: used.join(", ") })) + "</p>";
      } else if (opts.length) {
        body = '<div class="rows">' + opts.map(function (id) { return row(E.course(id), "m-" + m.id + "-" + i + "-" + id, maybeSet[id] ? T("tagMaybe") : ""); }).join("") + "</div>";
      } else body = '<p class="cov">' + T("noDtu") + "</p>";
      if (r.supp) {
        var sid = "s-" + m.id + "-" + i;
        body += '<label class="num" for="' + sid + '">' + T("suppIn") + ' <input type="number" id="' + sid + '" data-supp="' + key + '" min="0" max="30" step="2.5" value="' + (Number(st.supp[key]) || 0) + '"></label>';
      }
      if (res.ok === "maybe") body += '<p class="rnote">' + esc(r.maybeNote ? L(r.maybeNote) : T("maybeGen")) + "</p>";
      if (r.hint) body += '<p class="rnote">' + esc(L(r.hint)) + "</p>";
      if (r.est) body += '<p class="rnote">' + T("est") + "</p>";
    }
    return '<li class="rule rule-' + state + '"><div class="rhead"><span class="rmark">' + T(state) + '</span><span class="rlabel">' + esc(L(r.label)) + "</span>" +
      (prog ? '<span class="rprog">' + esc(prog) + "</span>" : "") + "</div>" + body + "</li>";
  }

  function masterHtml(m, H) {
    var r = E.evalMaster(m, pref.b, H, st), p = r.plan, sug = p.mode === "rules" ? E.suggest(m, pref.b, H, st) : [];

      '<span class="msname">' + esc(L(m.name)) + (m.uni.toLowerCase() !== bach(pref.b).uni ? ' <span class="unitag">' + m.uni + "</span>" : "") + "</span>" +
      (r.status === "sikker" && !p.acc.qual && !extraRight(p) && (m.uni === "DTU" || p.acc.type === "r") ? "" : '<span class="mssub">' + esc(subline(m, r, sug)) + "</span>") + "</button>" + chip(m, r) +
      '<button type="button" class="wish" id="w-' + m.id + '" data-wish="' + m.id + '" aria-pressed="' + wished + '" title="' + T(wished ? "wishDel" : "wishAdd") + '">' + (wished ? "★" : "☆") + '<span class="vh"> ' + T("wish") + "</span></button></div>";
    if (open) {
      h += '<div class="msbody">';
      if (m.name.en !== m.name.da) h +='<p class="en">' + esc(pref.lang === "da" ? m.name.en : m.name.da) + "</p>";
      if (r.status === "sikker" && !p.acc.qual) h += "<p>" + T(p.acc.type === "r" ? "dRet" : (m.uni === "DTU" ? "dDir" : "dKU"), { u: m.uni }) + "</p>";
      if (!isDtu() && p.acc && p.acc.qual) h += "<p>" + esc(T(p.acc.type === "r" ? "dQualR" : "dQualA", { u: m.uni, q: quals(p), w: T(bach(pref.b).uni === "ruc" ? "wFag" : "wBach") })) + "</p>";
      if (extraRight(p)) h += "<p>" + esc(T("dRightIf", { q: extraRight(p) })) + "</p>";
      if (isDtu() && (p.all.length > 1 || (p.acc && p.acc.qual))) {
        h += "<p>" + T("dAll") + " " + p.all.map(function (x) {
          return esc((x.type === "r" ? T("cRet") : T("cDir")) + ": " + (x.qual || T("allSpec")) + (x.star ? " (" + T("withCourses") + ")" : ""));
        }).join("; ") + ".</p>";
      }
      if (r.status === "betinget") h += "<p>" + (p.cond ? T(m.uni === "DTU" ? "dBet" : "dBetX", { u: m.uni }) + " " + esc(L(p.cond)) : T("dBetNo")) + "</p>";
      if (r.status === "info") h += "<p>" + (m.uni === "DTU" ? T("dInd") : T("dIndX", { u: m.uni })) + "</p>";
      if (m.desc && r.status === "info") h += "<p>" + esc(L(m.desc)) + "</p>";
      if (m.req && p.mode !== "rules") h += "<p><strong>" + T("reqH") + "</strong> " + esc(L(m.req)) + "</p>";
      if (p.mode === "rules") {
        if (m.uni === "DTU") h += "<p>" + T(p.acc ? "dRulesS" : "dRules") + "</p>";
        h += "<h4>" + T("krav") + '</h4><ul class="rules">' + p.rules.map(function (rr, i) { return ruleHtml(m, rr, i, r.rules[i]); }).join("") + "</ul>";
        if (sug.length) {
          var e = 0; sug.forEach(function (id) { e += E.ects(id); });
          h += '<button type="button" class="btn" id="a-' + m.id + '" data-add="' + m.id + '">' + T("addBtn", { e: e }) + "</button>";
        }
      }
      if (m.rec && m.rec.length) {
        h += "<h4>" + T("rec") + "</h4>" + (m.recNote ? "<p>" + esc(L(m.recNote)) + "</p>" : "") +
          '<div class="rows">' + m.rec.map(function (id) { return row(E.course(id), "r-" + m.id + "-" + id); }).join("") + "</div>";
      } else if (m.recNote) h += "<p>" + esc(L(m.recNote)) + "</p>";
      if (m.notes.length) h += '<ul class="notes">' + m.notes.map(function (n) { return "<li>" + esc(L(n)) + "</li>"; }).join("") + "</ul>";
      h += '<p class="src">' + esc(T("src", { f: L(m.frist) })) + ' <a href="' + esc(m.url) + '">' + T("srcLink") + "</a>" + esc(T("srcChk", { d: L(KP.checked) })) + "</p></div>";
    }
    return h + "</article>";
  }

  var TIER = { sikker: 0, opfyldt: 1, maybe: 2, mangler: 3, betinget: 4, info: 5 };
  function renderMasters() {
    var H = has(), ev = {};
    var rk = {};
    KP.masters.forEach(function (m) { var r = E.evalMaster(m, pref.b, H, st); ev[m.id] = r.status; rk[m.id] = TIER[r.status] + (r.status === "sikker" ? (r.plan.acc.type !== "r" ? 0.5 : (r.plan.acc.qual ? 0.25 : 0)) : 0); });
    function pick(sts) {
      return KP.masters.map(function (m, i) { return { m: m, i: i }; })
        .filter(function (x) { return sts.indexOf(ev[x.m.id]) >= 0 && (ui.mUni === "alle" || x.m.uni === ui.mUni); })
        .sort(function (a, b) { return (rk[a.m.id] - rk[b.m.id]) || (a.i - b.i); });
    }
    function group(key, sts) { var l = pick(sts); return l.length ? '<h3 class="uni">' + T(key) + " (" + l.length + ")</h3>" + l.map(function (x) { return masterHtml(x.m, H); }).join("") : ""; }
    var info = pick(["info"]);
    var B0 = bach(pref.b), munis = ["DTU", "KU", "CBS", "RUC"].filter(function (u) { return KP.masters.some(function (m) { return m.uni === u; }); });
    var notes = [KP.uninotes && KP.uninotes[B0.uni], KP.bnotes && KP.bnotes[B0.id]].filter(Boolean);
    var html = stepHead("kandidater", "hMasters", T("lMasters")) +
      notes.map(function (n) { return '<p class="small unote">' + esc(L(n)) + "</p>"; }).join("") +
      (munis.length < 2 ? "" : '<div class="chips" role="group" aria-label="' + T("fUni") + '">' + [["alle", T("allSubj")]].concat(munis.map(function (u) { return [u, u]; })).map(function (x) {
        return '<button type="button" class="fchip" id="mu-' + x[0] + '" data-muni="' + x[0] + '" aria-pressed="' + (ui.mUni === x[0]) + '">' + x[1] + "</button>";
      }).join("") + "</div>") + group("gCan", ["sikker", "opfyldt", "maybe"]) + group("gMiss", ["mangler", "betinget"]) +
      '<button type="button" class="btn btn-ghost infotoggle" id="infotoggle" data-info="1" aria-expanded="' + ui.showInfo + '">' + T("notOn", { n: info.length }) + "</button>";
    if (ui.showInfo) html += '<p class="lede">' + T("notOnLead") + "</p>" + info.map(function (x) { return masterHtml(x.m, H); }).join("");
    if (KP.kuMissing && (B0.uni === "ku" || ui.mUni === "KU")) html += '<p class="small unote" id="kumissing">' + esc(L(KP.kuMissing)) + "</p>";
    $("p-kandidater").innerHTML = html + stepNav("kandidater");
  }

  // ---------- min plan ----------
  function wishPlan(H) {
    var sim = new Set(H), items = [], ws = st.wish.map(master).filter(Boolean), open = [];
    ws.forEach(function (m) { E.suggestInto(m, pref.b, sim, st).forEach(function (id) { items.push({ id: id, m: m.short }); }); });
    ws.forEach(function (m) {
      var r = E.evalMaster(m, pref.b, sim, st);
      if (r.status === "mangler") { var labs = []; r.plan.rules.forEach(function (rr, i) { if (r.rules[i].ok === false) labs.push(L(rr.label)); }); open.push({ m: m, labs: labs }); }
    });
    return { ws: ws, items: items, sim: sim, open: open };
  }
  function names(ids) {
    var l = ids.map(function (id) { return nr(id) + " " + L(E.course(id).name); });
    return l.length > 1 ? l.slice(0, -1).join(", ") + T("and") + l[l.length - 1] : l[0];
  }
  function semOpt(c, n) {
    var sp = E.offOf(c, pref.b).some(function (a) { var i = E.altInfo(a); return i.span && i.sems.indexOf(n) >= 0; });
    if (sp) return T("semN", { n: pref.lang === "da" ? n + ".–" + (n + 1) : n + "–" + (n + 1) });
    return T("semN", { n: n }) + " · " + T(n % 2 ? "autumnL" : "springL");
  }
  function semGrid(S) {
    if (!Object.keys(S.mods).length) return "";
    var di = pref.lang === "en" ? 1 : 0;
    function cell(mod) {
      var l = S.mods[mod] || [];
      return "<td" + (l.length > 1 ? ' class="bad"' : "") + ">" + l.map(function (id) { return '<span class="cn" title="' + esc(L(E.course(id).name)) + '">' + esc(nr(id)) + "</span>"; }).join("") + "</td>";
    }

      "<tr><th>13-17</th>" + DAYS.map(function (d) { return cell(d[3]); }).join("") + "</tr></tbody></table></div>";

  function itemWhen(it) {

    it.pers.forEach(function (p) { t.push(T("p3", { p: T(p) })); });
    if (!t.length) t.push(it.alt.txt ? L(it.alt.txt) : "–");
    return t.join(" + ") + (it.alt.n ? " (" + T("asNr", { c: it.alt.n }) + ")" : "") + (it.alt.q ? " (" + T("unconf") + ")" : "");
  }
  function extIn(n) { return (st.ext || []).filter(function (x) { return x.sem === n; }); }
  function extSum(n) { return (st.ext || []).reduce(function (a, x) { return a + (n === undefined || x.sem === n ? x.ects : 0); }, 0); }
  function extName(x) { return x.name || T("extDefault"); }
  // En linje i semestret for ECTS fra et andet universitet: kan flyttes til et hvilket som helst semester og fjernes.
  function extHtml(x, S) {
    var opts = [], i;
    for (i = 1; i <= 6 + st.extra; i++) if (i !== S.n) opts.push(i);
    return '<div class="si si-ext">' + (x.nr ? '<span class="nr">' + esc(x.nr) + "</span>" : '<span class="nr arrow" aria-hidden="true">↗</span>') + '<span class="nm">' + esc(extName(x)) + ' <span class="tag tag-ext">' + T("tagExt") + '</span></span><span class="ec">' + x.ects + "</span>" +
      '<span class="sk"><span class="tm">' + T("extLine") + '</span><span class="ctl"><select class="mvs" id="xm-' + x.k + '" data-xmv="' + x.k + '" aria-label="' + esc(T("moveA", { c: extName(x) })) + '"><option value="">' + T("move") + "</option>" +
      opts.map(function (n) { return '<option value="' + n + '">' + T("moveTo", { n: n, s: T(n % 2 ? "autumn" : "spring").toLowerCase() }) + "</option>"; }).join("") + "</select>" +
      '<button type="button" class="rmb" id="xr-' + x.k + '" data-xrm="' + x.k + '" aria-label="' + esc(T("rmA", { c: extName(x) })) + '">' + T("remove") + "</button></span></span></div>";
  }
  function extForm(S) {
    var def = S.items.length || extIn(S.n).length ? 5 : 30;
    return '<div class="extform" id="extform"><p class="pgsub">' + T("extHelp") + "</p>" +
      '<div class="find"><label class="vh" for="xnr">' + T("extNrL") + '</label><input type="text" id="xnr" class="xnr" maxlength="10" autocomplete="off" placeholder="' + T("extNrPh") + '">' +

      '<button type="button" class="btn btn-sm" id="xsave" data-xsave="' + S.n + '">' + T("extSave") + "</button></div></div>";
  }
  // Flyt et kursus til et andet semester, hvor det udbydes.
  function moveSel(c, cur) {
    var opts = E.validSems(c, pref.b).filter(function (n) { return n !== cur; });

      opts.map(function (n) { return '<option value="' + n + '">' + T("moveTo", { n: n, s: T(n % 2 ? "autumn" : "spring").toLowerCase() }) + "</option>"; }).join("") + "</select>";

  // Lille mærke ved kurset i semesterplanen: obligatorisk, gruppe 2/3, anbefalet eller retningsspecifik.
  function roleTag(c) {
    var r = role(c);
    if (r === "valgfri") return "";

    if (r === "g3") return ' <span class="tag">' + T("tagG3") + "</span>";

  }
  function itemHtml(it, S) {
    var c = E.course(it.id), bad = S.clashes.some(function (cl) { return cl.ids.indexOf(it.id) >= 0; });
    var ctl = it.part === 2 ? '<span class="contd">' + T("contd", { n: it.start }) + "</span>" :
      '<span class="ctl">' + moveSel(c, it.start) + '<button type="button" class="rmb" id="rm-' + c.id + '" data-rm="' + c.id + '" aria-label="' + esc(T("rmA", { c: c.nr + " " + L(c.name) })) + '">' + T("remove") + "</button></span>";
    return '<div class="si' + (bad ? " bad" : "") + '"><span class="nr">' + esc(c.nr) + '</span><span class="nm">' + esc(L(c.name)) +
      (it.part ? ' <span class="tag">' + T("part", { k: it.part }) + "</span>" : "") + roleTag(c) + '</span><span class="ec">' + it.ects + "</span>" +
      '<span class="sk"><span class="tm">' + esc(itemWhen(it)) + "</span>" + ctl + "</span></div>";
  }
  function semCard(S) {
    var open = ui.semOpen[S.n] !== undefined ? ui.semOpen[S.n] : S.clashes.length > 0;
    var xs = extIn(S.n), ects = S.ects + extSum(S.n);
    var h = '<section class="sem' + (S.clashes.length ? " hasclash" : "") + '"><button type="button" class="semh" id="se-' + S.n + '" data-semopen="' + S.n + '" aria-expanded="' + open + '">' +
      '<span class="t">' + T("semN", { n: S.n }) + ' <span class="sea sea-' + S.season + '">' + T(S.season === "E" ? "autumn" : "spring") + "</span>" + (S.n > 6 ? ' <span class="tag">' + T("tagExtra") + "</span>" : "") +

  // ---------- Kandidatplan ----------

  function mAlloc() {
    var mp = mplan(), got = {}, where = {}, rest = mp.blocks[mp.blocks.length - 1], r = { got: got, where: where, pf: 0, ps: 0, bsc: 0, trans: 0 };
    var chosen = st.ms.c.filter(function (id) { return id !== "SPEC"; }), pool = 0, extra = 0, other = 0;
    mp.blocks.forEach(function (b) { got[b.id] = 0; });
    mp.blocks.forEach(function (b) { b.c.forEach(function (id) { if (chosen.indexOf(id) >= 0 && !where[id] && got[b.id] < b.need) { where[id] = b.id; got[b.id] += E.course(id).ects; } }); });
    mp.blocks.forEach(function (b) {
      var cnt = Math.min(got[b.id], b.need), sur = got[b.id] - cnt;
      if (b.grp === "pf") { r.pf += cnt; extra += sur; }
      else if (b === rest) pool += got[b.id];

    });
    chosen.forEach(function (id) {
      var c = E.course(id);

      if (where[id]) return;

      else if (c.level === "MSc") { other += c.ects; where[id] = "el"; }

    document.documentElement.lang = pref.lang;
    var B0 = pref.b ? bach(pref.b) : null, view = B0 ? ui.view : "bachelor";
    if (B0 && !steps().some(function (s) { return s[0] === view; })) view = ui.view = steps()[1][0];
    $("top").innerHTML = '<div class="toprow"><h1>' + T("title") + '</h1><div class="lang" role="group" aria-label="Sprog / Language">' +
      '<button type="button" id="l-da" data-lang="da" aria-pressed="' + (pref.lang === "da") + '">Dansk</button>' +
      '<button type="button" id="l-en" data-lang="en" aria-pressed="' + (pref.lang === "en") + '">English</button></div></div>' +
      (view === "bachelor" ? "<p>" + T("lead") + "</p>" : "");
    $("foot").innerHTML = "<p>" + esc(T("unofficial", { d: L(KP.checked) })) + "</p><p>" + esc(T("foot")) + "</p>";
    document.body.setAttribute("data-view", view === "bachelor" ? "start" : view);
    if (B0) {
      var S0 = E.summarize(KP, has(), st.other + extSum(), pref.b);
      NEED = S0.need || NEED;
      E.setSems(6 + (st.extra || 0));
      SP = E.semPlan(KP, pref.b, has(), st.sem); CL = {};
      SP.sems.forEach(function (S) { S.clashes.forEach(function (cl) { cl.ids.forEach(function (id) { (CL[id] = CL[id] || []).push({ n: S.n, season: S.season, cl: cl }); }); }); });
      if (B0.uni === "dtu") { renderMeters(S0, B0); renderCourses(S0, B0); } else { $("meters").innerHTML = ""; $("p-kurser").innerHTML = ""; }
      renderMasters(); renderPlan(B0); if (B0.uni === "dtu") renderMaster(B0); else $("p-kandidatplan").innerHTML = "";
    }
    renderStart(B0);
    $("tabs").style.gridTemplateColumns = "repeat(" + steps().length + ", minmax(0, 1fr))";
    $("tabs").innerHTML = steps().map(function (s, i) {
      var inner = '<span class="sn">' + (i + 1) + '</span><span class="sl">' + T(s[1]) + "</span>" + (s[0] === "kurser" && B0 && SP.clashes ? '<span class="tabbadge">' + SP.clashes + "</span>" : "");
      return '<button type="button" class="step" id="st-' + s[0] + '" data-go="' + s[0] + '"' + (view === s[0] ? ' aria-current="step"' : "") + (!B0 && i > 0 ? " disabled" : "") + ">" + inner + "</button>";
    }).join("");
    if (act && $(act)) { try { $(act).focus({ preventScroll: true }); } catch (e) { } }
  }
  function go(v) {
    if (!VIEWS[v] || (!pref.b && v !== "bachelor")) return;
    ui.view = v; render(); window.scrollTo(0, 0);
    try { if (location.hash !== "#" + v) location.hash = v; } catch (e) { }
  }
  function commit() { syncSem(); save(); render(); }
  function toggle(id, on) { var i = st.c.indexOf(id); if (on && i < 0) st.c.push(id); if (!on && i >= 0) st.c.splice(i, 1); }
  function code() { var o = { b: pref.b }; for (var k in st) o[k] = st[k]; return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.hasAttribute("data-course")) { toggle(t.getAttribute("data-course"), t.checked); commit(); }
    else if (t.hasAttribute("data-mmv")) { if (t.value !== "") { st.ms.sem[t.getAttribute("data-mmv")] = Number(t.value); commit(); } }
    else if (t.hasAttribute("data-xmv")) { var xm = Number(t.value), xi = Number(t.getAttribute("data-xmv")); if (xm) { st.ext.forEach(function (x) { if (x.k === xi) x.sem = xm; }); ui.semOpen[xm] = true; commit(); } }
    else if (t.hasAttribute("data-mv")) { var mn = Number(t.value); if (mn) { st.sem[t.getAttribute("data-mv")] = mn; ui.semOpen[mn] = true; commit(); } }
    else if (t.hasAttribute("data-flag")) { st.flags[t.getAttribute("data-flag")] = t.checked; commit(); }
    else if (t.hasAttribute("data-supp")) { st.supp[t.getAttribute("data-supp")] = Math.max(0, Math.min(30, Number(t.value) || 0)); commit(); }
    else if (t.hasAttribute("data-af")) { ui.addFilter = t.value; ui.addLimit = 10; if ($("plist")) $("plist").innerHTML = pickList(ui.addSem); }
    else if (t.id === "other") { st.other = Math.max(0, Math.min(45, Number(t.value) || 0)); commit(); }
  });
  // Søgning: kun kursuslisten tegnes om, så markøren bliver i søgefeltet.
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "mq") { ui.mq = ev.target.value; if ($("mplist")) $("mplist").innerHTML = mPickList(ui.mAdd); return; }
    if (ev.target.id !== "q") return;
    ui.q = ev.target.value;
    ui.addLimit = 10;
    if ($("plist")) $("plist").innerHTML = pickList(ui.addSem);
  });
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("button") : null;
    if (!t) return;
    if (t.id !== "reset") ui.resetArmed = false;
    if (t.hasAttribute("data-lang")) { pref.lang = t.getAttribute("data-lang"); ui.msg = ""; commit(); }
    else if (t.hasAttribute("data-bach")) { if (t.getAttribute("data-bach") !== pref.b) setBach(t.getAttribute("data-bach")); pref.u = bach(pref.b).uni; ui.pickUni = false; save(); go(steps()[1][0]); }
    else if (t.hasAttribute("data-uni")) { pref.u = t.getAttribute("data-uni"); ui.pickUni = false; save(); render(); window.scrollTo(0, 0); }
    else if (t.hasAttribute("data-chuni")) { ui.pickUni = true; render(); }
    else if (t.hasAttribute("data-muni")) { ui.mUni = t.getAttribute("data-muni"); render(); }
    else if (t.hasAttribute("data-go")) { go(t.getAttribute("data-go")); }
    else if (t.hasAttribute("data-mpick")) {
      var mid = t.getAttribute("data-mpick"), mp0 = KP.mplans[mid]; st.ms = { id: mid, c: [], sem: {} };
      for (var mk in mp0.start) if (st.c.indexOf(mk) < 0) { st.ms.c.push(mk); st.ms.sem[mk] = mp0.start[mk]; }
      ui.mAdd = null; ui.mOther = false; ui.mArm = false; commit();
    }
    else if (t.hasAttribute("data-mclear")) { if (ui.mArm) { st.ms = { id: null, c: [], sem: {} }; ui.mArm = false; ui.mAdd = null; commit(); } else { ui.mArm = true; render(); } }
    else if (t.hasAttribute("data-maddsem")) { var mn = Number(t.getAttribute("data-maddsem")); ui.mAdd = ui.mAdd === mn ? null : mn; ui.mCat = null; ui.mAll = null; ui.mq = ""; render(); }
    else if (t.hasAttribute("data-mother")) { ui.mOther = true; render(); }
    else if (t.hasAttribute("data-madd")) { var ma = t.getAttribute("data-madd"); if (st.ms.c.indexOf(ma) < 0 && ui.mAdd !== null && ui.mAdd !== undefined) { st.ms.c.push(ma); st.ms.sem[ma] = ui.mAdd; commit(); } }
    else if (t.hasAttribute("data-mrm")) { var mr = t.getAttribute("data-mrm"); st.ms.c = st.ms.c.filter(function (id) { return id !== mr; }); delete st.ms.sem[mr]; commit(); }
    else if (t.hasAttribute("data-xadd")) { var xn = Number(t.getAttribute("data-xadd")); ui.extSem = ui.extSem === xn ? null : xn; ui.addSem = null; ui.semOpen[xn] = true; render(); if ($("xnr")) $("xnr").focus(); }
    else if (t.hasAttribute("data-xsave")) {
      var xe = Math.round((Number($("xects").value) || 0) * 2) / 2, xk = st.ext.reduce(function (a, x) { return Math.max(a, x.k); }, 0) + 1;
      if (xe > 0 && xe <= 60 && st.ext.length < 12) { st.ext.push({ k: xk, sem: Number(t.getAttribute("data-xsave")), ects: xe, name: $("xname").value.trim().slice(0, 80), nr: $("xnr").value.trim().slice(0, 10) }); ui.extSem = null; commit(); }
    }
    else if (t.hasAttribute("data-xrm")) { var rk = Number(t.getAttribute("data-xrm")); st.ext = st.ext.filter(function (x) { return x.k !== rk; }); commit(); }
    else if (t.hasAttribute("data-pcat")) {
      var pc = t.getAttribute("data-pcat");
      ui.pickCat = ui.pickCat === pc ? null : pc; ui.pickAll = null;
      if ($("plist")) { $("plist").innerHTML = pickList(ui.addSem); if ($("pc-" + pc)) $("pc-" + pc).focus(); }
    }
    else if (t.hasAttribute("data-acc")) { var k = t.getAttribute("data-acc"); ui.acc = ui.acc === k ? null : k; render(); }
    else if (t.hasAttribute("data-allsubj")) { var sj = t.getAttribute("data-allsubj"); ui.allSubj[sj] = !ui.allSubj[sj]; render(); }
    else if (t.hasAttribute("data-grid")) { ui.showGrid = !ui.showGrid; render(); }
    else if (t.hasAttribute("data-addsem")) {
      var an = Number(t.getAttribute("data-addsem"));
      ui.addSem = ui.addSem === an ? null : an; ui.q = ""; ui.addFilter = "alle"; ui.addLimit = 10; ui.pickCat = null; ui.pickAll = null; ui.extSem = null; ui.semOpen[an] = true; render();
      if (ui.addSem && $("q")) { try { $("q").focus({ preventScroll: true }); } catch (e) { } }
    }
    else if (t.hasAttribute("data-addc")) { var ac = t.getAttribute("data-addc"); toggle(ac, true); st.sem[ac] = ui.addSem; commit(); if ($("q")) { try { $("q").focus({ preventScroll: true }); } catch (e) { } } }
    else if (t.hasAttribute("data-rm")) { toggle(t.getAttribute("data-rm"), false); commit(); }
    else if (t.hasAttribute("data-extra")) {
      if (t.getAttribute("data-extra") === "1") { if (st.extra < 4) { st.extra++; ui.semOpen[6 + st.extra] = true; } }
      else if (st.extra > 0 && !SP.sems[SP.sems.length - 1].items.length && !extIn(6 + st.extra).length) { if (ui.addSem === 6 + st.extra) ui.addSem = null; st.extra--; }
      commit();
    }
    else if (t.hasAttribute("data-pall")) { ui.pickAll = t.getAttribute("data-pall"); if ($("plist")) $("plist").innerHTML = pickList(ui.addSem); }
    else if (t.hasAttribute("data-mcat")) { var mc = t.getAttribute("data-mcat"); ui.mCat = ui.mCat === mc ? null : mc; ui.mAll = null; if ($("mplist")) { $("mplist").innerHTML = mPickList(ui.mAdd); if ($("pc-" + mc)) $("pc-" + mc).focus(); } }
    else if (t.hasAttribute("data-mall")) { ui.mAll = t.getAttribute("data-mall"); if ($("mplist")) $("mplist").innerHTML = mPickList(ui.mAdd); }
    else if (t.hasAttribute("data-pmore")) { ui.addLimit += 10; $("plist").innerHTML = pickList(ui.addSem); }
    else if (t.hasAttribute("data-semopen")) { ui.semOpen[t.getAttribute("data-semopen")] = t.getAttribute("aria-expanded") !== "true"; render(); }
    else if (t.hasAttribute("data-save")) { ui.showSave = true; render(); }
    else if (t.hasAttribute("data-open")) { var id = t.getAttribute("data-open"); ui.open = ui.open === id ? null : id; render(); }
    else if (t.hasAttribute("data-info")) { ui.showInfo = !ui.showInfo; render(); }
    else if (t.hasAttribute("data-wish")) { var w = t.getAttribute("data-wish"), i = st.wish.indexOf(w); if (i < 0) st.wish.push(w); else st.wish.splice(i, 1); commit(); }
    else if (t.hasAttribute("data-add")) { E.suggest(master(t.getAttribute("data-add")), pref.b, has(), st).forEach(function (x) { toggle(x, true); }); commit(); }
    else if (t.hasAttribute("data-addwish")) { wishPlan(has()).items.forEach(function (x) { toggle(x.id, true); }); commit(); }
    else if (t.hasAttribute("data-replan")) { if (ui.rpArm) { st.sem = {}; ui.rpArm = false; commit(); } else { ui.rpArm = true; render(); } }
    else if (t.id === "copy") {
      var c = code(); ui.msg = T("mCopy1"); render(); $("code").value = c; $("code").select();
      try { navigator.clipboard.writeText(c).then(function () { ui.msg = T("mCopy2"); $("msg").textContent = ui.msg; }, function () { }); } catch (e) { }
    }
    else if (t.id === "loadcode") {
      var ok = false;
      try {
        var o = JSON.parse(decodeURIComponent(escape(atob($("code").value.trim()))));
        if (o && bach(o.b) && Array.isArray(o.c)) { pref.b = o.b; OPENS = E.opens(KP, pref.b); st = blank(null); ok = apply(o); }
      } catch (e) { ok = false; }
      ui.msg = T(ok ? "mLoad" : "mBad");
      if (ok) commit(); else render();
    }
    else if (t.id === "reset") {
      if (!ui.resetArmed) { ui.resetArmed = true; render(); }
      else { ui.resetArmed = false; st = blank(pref.b); ui.msg = T("mReset"); commit(); }
    }
  });

  function route() { var h = (location.hash || "").replace("#", ""); if (VIEWS[h]) ui.view = h; render(); }
  window.addEventListener("hashchange", route);
  try { var p = JSON.parse(localStorage.getItem(PREF) || "null"); if (p) { if (p.lang === "en" || p.lang === "da") pref.lang = p.lang; if (bach(p.b)) pref.b = p.b; if (p.u && uniOf(p.u) && uniOf(p.u).ready) pref.u = p.u; } } catch (e) { }
  if (pref.b) { loadPlan(); ui.view = steps()[1][0]; }
  route();
})();

</script>
</body>
</html>
